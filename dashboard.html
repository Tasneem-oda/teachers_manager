<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>الرئيسية - Teachers Manager</title>
    <link rel="stylesheet" href="css/style.css?v=4">
    <!-- PWA: أيقونات التطبيق والبيانات الوصفية اللازمة للتثبيت على الشاشة الرئيسية والدومين -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4B3A5A">
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXC2WZMT"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="app-shell">
        <div id="sidebar-root"></div>

        <main class="main-content">
            <div id="top-header-root"></div>

            <div class="page-body">
                <div id="loading" class="loading">جاري تحميل البيانات...</div>

                <div id="content" style="display:none;">
                    <div id="trial-banner-root"></div>

                    <div class="stats-row" id="stats-row"></div>

                    <div class="dashboard-grid">
                        <!-- حصص اليوم -->
                        <div class="card">
                            <div class="flex" style="margin-bottom:1rem;">
                                <h3 style="margin:0; display:flex; align-items:center; gap:0.5rem;"><span id="ic-today" class="icon"></span>حصص اليوم</h3>
                                <a href="schedule.html" style="font-size:0.82rem; color:var(--primary); text-decoration:none; font-weight:600;">عرض الجدول كامل</a>
                            </div>
                            <div id="today-lessons-list"></div>
                        </div>

                        <!-- المساعد الذكي + الملاحظات -->
                        <div style="display:flex; flex-direction:column; gap:1.5rem;">
                            <!-- المساعد الذكي -->
                            <div class="ai-card">
                                <h3><span id="ic-ai" class="icon"></span> المساعد الذكي</h3>
                                <p class="sub" id="ai-card-sub">شات تفاعلي بذاكرة خاصة بكل طالب — متاح الآن من صفحة كل حصة</p>
                                <div class="ai-quick-actions">
                                    <button type="button" id="btn-open-ai-assistant" class="btn-ai-pulse"><span id="ic-ai-enter" class="icon"></span> فتح المساعد الذكي</button>
                                </div>
                            </div>

                            <div class="card notes-panel">
                                <div class="flex" style="margin-bottom:0.5rem;">
                                    <h3 style="margin:0; font-size:0.95rem;"><span id="ic-notes" class="icon"></span> آخر الملاحظات</h3>
                                </div>
                                <div id="recent-notes-hint" style="font-size:0.82rem; color:var(--text-secondary);">
                                    افتح ملف أي طالب من صفحة "الطلاب" لعرض وإضافة ملاحظاته.
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card" style="margin-top:1.5rem;">
                        <h3 style="margin-bottom:1rem;">روابط سريعة</h3>
                        <div class="quick-links-grid">
                            <a href="students.html?action=add" class="quick-link-btn"><span class="icon" id="ic-ql-add"></span> إضافة طالب</a>
                            <a href="schedule.html" class="quick-link-btn"><span class="icon" id="ic-ql-schedule"></span> جدول المواعيد</a>
                            <a href="books.html" class="quick-link-btn"><span class="icon" id="ic-ql-books"></span> كتابي</a>
                            <a href="students.html" class="quick-link-btn"><span class="icon" id="ic-ql-notes"></span> ملاحظات الطلاب</a>
                            <a href="subscription.html" class="quick-link-btn"><span class="icon" id="ic-ql-sub"></span> الاشتراك</a>
                            <a href="settings.html" class="quick-link-btn"><span class="icon" id="ic-ql-settings"></span> الإعدادات</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="error-toast" style="display:none;"></div>
    <div id="success-toast" style="display:none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config.js?v=4"></script>
    <script type="module">
        import { Auth } from './js/auth.js?v=4';
        import { api } from './js/api.js?v=4';
        import { ErrorHandler, Formatters, TimeUtils } from './js/utils.js?v=4';
        import { renderSidebar, renderTopHeader, renderTrialBanner } from './js/sidebar.js?v=4';
        import { icon } from './js/icons.js?v=4';

        renderSidebar('dashboard');

        // بيانات آخر تحميل للوحة التحكم - نحتفظ بيها هنا عشان زرار
        // "فتح المساعد الذكي" يقدر يقرر يوديك على شات حصة النهاردة مباشرة
        let dashboardData = null;

        document.getElementById('ic-today').innerHTML = icon('calendar', { size: 17 });
        document.getElementById('ic-ai').innerHTML = icon('sparkles', { size: 17 });
        document.getElementById('ic-ai-enter').innerHTML = icon('link', { size: 15 });
        document.getElementById('ic-notes').innerHTML = icon('clipboard', { size: 16 });
        document.getElementById('ic-ql-add').innerHTML = icon('plus', { size: 19 });
        document.getElementById('ic-ql-schedule').innerHTML = icon('calendar', { size: 19 });
        document.getElementById('ic-ql-books').innerHTML = icon('bookOpen', { size: 19 });
        document.getElementById('ic-ql-notes').innerHTML = icon('edit', { size: 19 });
        document.getElementById('ic-ql-sub').innerHTML = icon('creditCard', { size: 19 });
        document.getElementById('ic-ql-settings').innerHTML = icon('gear', { size: 19 });

        function greeting() {
            const h = new Date().getHours();
            if (h < 12) return 'صباح الخير';
            return 'مساء الخير';
        }

        function dateStr() {
            return new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        function renderStats(data) {
            const items = [
                { icon: 'users', color: 'var(--primary)', bg: 'rgba(75,58,90,0.1)', num: data.studentsCount ?? 0, label: 'إجمالي الطلاب', link: 'students.html' },
                { icon: 'calendar', color: 'var(--secondary)', bg: 'rgba(197,154,74,0.15)', num: data.todayLessonsCount ?? 0, label: 'حصص اليوم', link: 'schedule.html' },
                { icon: 'clock', color: 'var(--success)', bg: 'rgba(111,143,114,0.15)', num: (data.schedules || []).length, label: 'مواعيد ثابتة أسبوعيًا', link: 'schedule.html' },
                { icon: 'creditCard', color: 'var(--warning)', bg: 'rgba(212,165,116,0.2)', num: data.subscription?.status === 'trial' ? 'تجريبي' : (data.subscription?.status === 'active' ? 'فعّال' : '—'), label: 'حالة الاشتراك', link: 'subscription.html' }
            ];
            document.getElementById('stats-row').innerHTML = items.map(it => `
                <div class="stat-card">
                    <div class="stat-icon" style="background:${it.bg}; color:${it.color};">${icon(it.icon, { size: 18 })}</div>
                    <p class="stat-num">${it.num}</p>
                    <p class="stat-label">${it.label}</p>
                    <a class="stat-link" href="${it.link}">عرض التفاصيل</a>
                </div>
            `).join('');
        }

        // حالة كل حصة اليوم: null (لسه ماعملهاش/ممكن تكون فاتت) | in_progress | completed | cancelled
        // بتتحمّل من endpoint منفصل (get-today-lessons) وبتتوصل بـ student_id
        // مع لستة data.todayLessons الأصلية. لو الـ endpoint فشل (لسه معملوش
        // import في n8n مثلاً) بنكمل عادي من غير تمييز حالات - مفيش كسر للصفحة.
        let todayStatusMap = {};

        function getLessonState(lesson) {
            const info = todayStatusMap[lesson.student_id] || {};
            const status = info.status || null;
            if (status === 'completed') return { state: 'completed', lessonId: info.lessonId };
            if (status === 'cancelled') return { state: 'cancelled', lessonId: info.lessonId };
            if (status === 'in_progress') return { state: 'in_progress', lessonId: info.lessonId };

            // مفيش صف مسجّل النهاردة لهذا الطالب - نحدد لسه معاداها ما جاش
            // ولا فات ميعادها (بالمقارنة بوقت الجهاز الحالي)
            const t = TimeUtils.getTimeFromString(lesson.start_time);
            if (t) {
                const now = new Date();
                const startMinutes = t.hours * 60 + t.minutes;
                const nowMinutes = now.getHours() * 60 + now.getMinutes();
                if (nowMinutes > startMinutes) return { state: 'late', lessonId: null };
            }
            return { state: 'upcoming', lessonId: null };
        }

        function renderTodayLessons(lessons) {
            const container = document.getElementById('today-lessons-list');
            if (!lessons || lessons.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد حصص مجدولة اليوم 🎉</div>';
                return;
            }
            container.innerHTML = lessons.map(l => {
                const { state } = getLessonState(l);

                let badge = '';
                let actionsHtml = '';

                if (state === 'completed') {
                    // تمت بنجاح: نشيل زرار "ابدأ الحصة" خالص، بنعرض شارة بس
                    badge = `<span class="lesson-status-badge status-completed">${icon('checkCircle', { size: 11 })} تمت بنجاح</span>`;
                } else if (state === 'cancelled') {
                    // اتلغت يدويًا: شكل مميز (باهت + خط فوق الاسم)، من غير أي أزرار
                    badge = `<span class="lesson-status-badge status-cancelled">${icon('x', { size: 11 })} تم إلغاء الحصة</span>`;
                } else if (state === 'in_progress') {
                    // بدأها المعلم فعلاً ولسه ماخلصهاش - إتاحة المتابعة، من غير زرار إلغاء
                    badge = `<span class="lesson-status-badge status-in-progress">${icon('clock', { size: 11 })} قيد التنفيذ الآن</span>`;
                    actionsHtml = `<button class="btn btn-start" onclick="location.href='lesson.html?student_id=${l.student_id}'">${icon('play', { size: 13 })} متابعة الحصة</button>`;
                } else {
                    // upcoming أو late: لسه ماعملهاش، فيها إمكانية البدء في أي وقت + إلغائها
                    if (state === 'late') {
                        badge = `<span class="lesson-status-badge status-late">${icon('clock', { size: 11 })} فات ميعادها</span>`;
                    }
                    actionsHtml = `
                        <div class="lesson-actions">
                            <button class="btn btn-start" onclick="location.href='lesson.html?student_id=${l.student_id}'">${icon('play', { size: 13 })} ابدأ الحصة</button>
                            <button type="button" class="btn-cancel-lesson" data-student-id="${l.student_id}" data-student-name="${Formatters.escapeHtml(l.student_name || '')}">${icon('x', { size: 13 })} إلغاء</button>
                        </div>
                    `;
                }

                return `
                    <div class="lesson-item is-${state}">
                        <div class="lesson-main">
                            <div class="lesson-avatar">${Formatters.escapeHtml((l.student_name || '؟').charAt(0))}</div>
                            <div class="lesson-info">
                                <p class="name">${Formatters.escapeHtml(l.student_name || '')}</p>
                                <p class="meta">${Formatters.escapeHtml(l.current_topic || 'بدون موضوع محدد')}</p>
                                ${badge}
                            </div>
                        </div>
                        <div class="lesson-time">${Formatters.formatTime ? Formatters.formatTime(l.start_time) : l.start_time}</div>
                        ${actionsHtml}
                    </div>
                `;
            }).join('');
        }

        // إلغاء حصة اليوم: delegation على الحاوية لأن العناصر بتتعاد رسمها
        // مع كل تحديث (renderTodayLessons)
        document.getElementById('today-lessons-list').addEventListener('click', async (e) => {
            const btn = e.target.closest('.btn-cancel-lesson');
            if (!btn) return;
            const studentId = btn.dataset.studentId;
            const studentName = btn.dataset.studentName || 'الطالب';
            if (!confirm(`هل تريد إلغاء حصة "${studentName}" اليوم؟`)) return;

            try {
                btn.disabled = true;
                btn.textContent = 'جاري الإلغاء...';
                await api.cancelLesson(studentId);
                ErrorHandler.showSuccess('تم إلغاء الحصة');
                await loadDashboard();
            } catch (error) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(error));
                btn.disabled = false;
                btn.innerHTML = `${icon('x', { size: 13 })} إلغاء`;
            }
        });

        // تحديث نص التلميح تحت "المساعد الذكي" حسب وجود حصص اليوم من عدمه،
        // عشان الزرار يوصف فعليًا اللي هيحصل لما المستخدم يضغط عليه
        function updateAiCardHint() {
            const hintEl = document.getElementById('ai-card-sub');
            const lessons = (dashboardData && dashboardData.todayLessons) || [];
            if (lessons.length > 0) {
                hintEl.textContent = `شات تفاعلي بذاكرة خاصة بكل طالب — هيفتح دلوقتي على حصة ${lessons[0].student_name || 'اليوم'}`;
            } else {
                hintEl.textContent = 'شات تفاعلي بذاكرة خاصة بكل طالب — متاح من صفحة أي حصة، اختَر طالبًا للبدء';
            }
        }

        // زرار "فتح المساعد الذكي": بيوديك على شات المساعد جوه حصة النهاردة
        // مباشرة لو فيه حصة، وإلا يوديك تختار طالب تبدأ معاه
        document.getElementById('btn-open-ai-assistant').addEventListener('click', () => {
            const lessons = (dashboardData && dashboardData.todayLessons) || [];
            if (lessons.length > 0 && lessons[0].student_id) {
                window.location.href = `lesson.html?student_id=${lessons[0].student_id}&open_ai=1`;
            } else if (dashboardData && (dashboardData.studentsCount || 0) > 0) {
                window.location.href = 'students.html';
            } else {
                window.location.href = 'students.html?action=add';
            }
        });

        async function loadDashboard() {
            try {
                const data = await api.getDashboard();
                dashboardData = data;

                // نجيب حالة حصص اليوم الفعلية (فات ميعادها/قيد التنفيذ/تمت/اتلغت)
                // من endpoint منفصل. لو فشل (مثلاً لسه ملهوش استيراد في n8n)
                // بنكمل عادي من غير تمييز حالات بدل ما نكسر الداشبورد كله.
                todayStatusMap = {};
                try {
                    const todayStatus = await api.getTodayLessons();
                    (todayStatus.lessons || []).forEach(item => {
                        todayStatusMap[item.student_id] = {
                            status: item.lesson_status || null,
                            lessonId: item.lesson_id || null
                        };
                    });
                } catch (statusError) {
                    todayStatusMap = {};
                }

                renderTopHeader({
                    title: `${greeting()} يا ${Formatters.escapeHtml((data.teacher?.name || '').split(' ')[0] || '')} 🌸`,
                    subtitle: dateStr()
                });
                renderStats(data);
                renderTodayLessons(data.todayLessons);
                renderTrialBanner();
                updateAiCardHint();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (err) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(err));
                document.getElementById('loading').textContent = 'تعذر تحميل بيانات لوحة التحكم.';
            }
        }

        (async () => {
            const authInfo = await Auth.requireAuth();
            if (!authInfo) return;
            await loadDashboard();
        })();
    </script>
    <script src="js/pwa-install.js?v=4" defer></script>
</body>
</html>
