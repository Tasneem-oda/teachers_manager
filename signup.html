<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل جديد - Teachers Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --bg: #FAF9F6; --primary: #4B3A5A; --text: #29252D; --card: #FFFFFF; --border: #E7E1E8; }
        body { font-family: 'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif; background-color: var(--bg-primary); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .signup-container { background: var(--card-bg); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); width: 100%; max-width: 450px; }
        .signup-container h2 { color: var(--primary); margin-bottom: 2rem; text-align: center; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary); }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(75, 58, 90, 0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .error { color: #B85C5C; font-size: 0.875rem; margin-top: 0.5rem; display: none; }
        .btn { width: 100%; padding: 0.75rem; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .btn:hover { background-color: #3F304D; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .success-message { display: none; background: #E8F5E9; color: #2E7D32; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
        .loading { text-align: center; display: none; }
        .spinner { border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 0.6s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .signup-container { padding: 1.5rem; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>📚 تسجيل جديد</h2>
        
        <div class="success-message" id="successMessage">
            تم التسجيل بنجاح! جاري التوجيه...
        </div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="name">الاسم الكامل *</label>
                <input type="text" id="name" name="name" placeholder="مثال: أحمد محمد" required>
                <div class="error" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني *</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف</label>
                <input type="tel" id="phone" name="phone" placeholder="01234567890">
                <div class="error" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label for="username">اسم المستخدم *</label>
                <input type="text" id="username" name="username" placeholder="مثال: ahmed_teacher" required>
                <div class="error" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور *</label>
                <input type="password" id="password" name="password" placeholder="8 أحرف على الأقل" required>
                <div class="error" id="passwordError"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="أعد كتابة كلمة المرور" required>
                <div class="error" id="confirmPasswordError"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="teachingType">نوع التدريس *</label>
                    <select id="teachingType" name="teachingType" required>
                        <option value="">اختر...</option>
                        <option value="private">دروس خصوصية</option>
                        <option value="group">مجموعات</option>
                        <option value="online">أونلاين</option>
                        <option value="offline">حضوري</option>
                        <option value="hybrid">مختلط</option>
                    </select>
                    <div class="error" id="teachingTypeError"></div>
                </div>

                <div class="form-group">
                    <label for="subject">المادة / المجال *</label>
                    <select id="subject" name="subject" required>
                        <option value="">اختر...</option>
                        <option value="quran">القرآن الكريم</option>
                        <option value="english">اللغة الإنجليزية</option>
                        <option value="arabic">اللغة العربية</option>
                        <option value="math">الرياضيات</option>
                        <option value="science">العلوم</option>
                        <option value="programming">البرمجة</option>
                        <option value="music">الموسيقى</option>
                        <option value="other">أخرى</option>
                    </select>
                    <div class="error" id="subjectError"></div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn">إنشاء الحساب</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري إنشاء الحساب...</p>
            </div>
        </form>

        <div class="login-link">
            لديك حساب؟ <a href="login.html">دخول</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module">
        import { Auth } from './js/auth.js';
        import { Validators, ErrorHandler } from './js/utils.js';

        const form = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');

        // تحقق من المستخدم المسجل
        window.addEventListener('load', async () => {
            const session = await Auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // إخفاء الأخطاء السابقة
            document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const teachingType = document.getElementById('teachingType').value;
            const subject = document.getElementById('subject').value;

            // التحقق من البيانات
            let hasErrors = false;

            if (!name || !Validators.name(name)) {
                document.getElementById('nameError').textContent = 'الاسم يجب أن يكون بين 2 و 100 حرف';
                document.getElementById('nameError').style.display = 'block';
                hasErrors = true;
            }

            if (!email || !Validators.email(email)) {
                document.getElementById('emailError').textContent = 'البريد الإلكتروني غير صحيح';
                document.getElementById('emailError').style.display = 'block';
                hasErrors = true;
            }

            if (phone && !Validators.phone(phone)) {
                document.getElementById('phoneError').textContent = 'رقم الهاتف غير صحيح';
                document.getElementById('phoneError').style.display = 'block';
                hasErrors = true;
            }

            if (!username || !Validators.username(username)) {
                document.getElementById('usernameError').textContent = 'اسم المستخدم يجب أن يكون 3-20 حرف';
                document.getElementById('usernameError').style.display = 'block';
                hasErrors = true;
            }

            if (!password || !Validators.password(password)) {
                document.getElementById('passwordError').textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل';
                document.getElementById('passwordError').style.display = 'block';
                hasErrors = true;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'كلمات المرور غير متطابقة';
                document.getElementById('confirmPasswordError').style.display = 'block';
                hasErrors = true;
            }

            if (!teachingType) {
                document.getElementById('teachingTypeError').textContent = 'اختر نوع التدريس';
                document.getElementById('teachingTypeError').style.display = 'block';
                hasErrors = true;
            }

            if (!subject) {
                document.getElementById('subjectError').textContent = 'اختر المادة';
                document.getElementById('subjectError').style.display = 'block';
                hasErrors = true;
            }

            if (hasErrors) return;

            // عرض حالة التحميل
            submitBtn.disabled = true;
            submitBtn.style.display = 'none';
            loading.style.display = 'block';

            // تنفيذ التسجيل
            const result = await Auth.signUp(name, email, phone, password, username, teachingType, subject);

            if (result.success) {
                successMessage.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            } else {
                ErrorHandler.showError(result.error);
                submitBtn.disabled = false;
                submitBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
