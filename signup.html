<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تسجيل جديد - Teachers Manager</title>
    <link rel="stylesheet" href="css/style.css?v=12">
    <!-- PWA: أيقونات التطبيق والبيانات الوصفية اللازمة للتثبيت على الشاشة الرئيسية والدومين -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4B3A5A">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; }
        .signup-container { background: var(--card-bg); padding: 2rem; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); width: 100%; max-width: 450px; }
        .signup-logo { width: 56px; height: 56px; border-radius: 16px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
        .signup-container h2 { color: var(--primary); margin-bottom: 2rem; text-align: center; font-size: 1.6rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-primary); }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 1rem; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(75, 58, 90, 0.1); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .error { color: #B85C5C; font-size: 0.875rem; margin-top: 0.5rem; display: none; }
        /* نص إرشادي هادئ تحت حقل اسم المستخدم يوضح القواعد المسموحة قبل ما المستخدم يغلط */
        .field-hint { display: block; color: var(--text-secondary, #767676); font-size: 0.8rem; margin-top: 0.4rem; line-height: 1.5; }
        .field-hint.hint-error { color: #B85C5C; }
        .btn { width: 100%; padding: 0.75rem; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .btn:hover { background-color: #3F304D; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .success-message { display: none; background: #E8F5E9; color: #2E7D32; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; text-align: center; }
        .loading { text-align: center; display: none; padding: 0; }
        .loading::before { display: none; content: none; }
        .spinner { border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 0.6s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 480px) {
            .signup-container { padding: 1.5rem; }
            .form-row { grid-template-columns: 1fr; }
        }
            .pw-wrap { position: relative; }
        .pw-wrap input { padding-left: 4.5rem !important; }
        .pw-toggle { position: absolute; left: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--primary, #4B3A5A); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; padding: 0.3rem 0.4rem; }
</style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXC2WZMT"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="signup-container">
        <div class="signup-logo" id="signup-logo"></div>
        <h2>تسجيل جديد</h2>
        
        <div class="success-message" id="successMessage">
            تم التسجيل بنجاح! جاري التوجيه...
        </div>
        
        <form id="signupForm">
            <div class="form-group">
                <label for="name">الاسم الكامل *</label>
                <input type="text" id="name" name="name" placeholder="مثال: أحمد محمد" required>
                <div class="error" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني *</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="phone">رقم الهاتف <small style="font-weight:400; color:var(--text-secondary);">(اختياري)</small></label>
                <!-- الحقل بيقبل أي رقم هاتف دولي (مش مقتصر على الأرقام المصرية) -->
                <input type="tel" id="phone" name="phone" placeholder="مثال: 01234567890 أو +966501234567">
                <div class="error" id="phoneError"></div>
            </div>

            

            <div class="form-group">
                <label for="password">كلمة المرور *</label>
                <div class="pw-wrap">
                    <input type="password" id="password" name="password" placeholder="8 أحرف على الأقل" autocomplete="new-password" required>
                    <button type="button" class="pw-toggle" id="pw-toggle" aria-label="إظهار كلمة المرور">إظهار</button>
                </div>
                <div class="error" id="passwordError"></div>
            </div>

            

            <div class="form-group">
                    <label for="subject">بتدرّس إيه؟ *</label>
                    <select id="subject" name="subject" required>
                        <option value="">اختر...</option>
                        <option value="quran">القرآن الكريم</option>
                        <option value="english">اللغة الإنجليزية</option>
                        <option value="arabic">اللغة العربية</option>
                        <option value="math">الرياضيات</option>
                        <option value="science">العلوم</option>
                        <option value="programming">البرمجة</option>
                        <option value="other">أخرى</option>
                    </select>
                    <div class="error" id="subjectError"></div>
                </div>

            <button type="submit" id="submitBtn" class="btn">إنشاء الحساب</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري إنشاء الحساب...</p>
            </div>
        </form>

        <div class="login-link">
            لديك حساب؟ <a href="login.html">دخول</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config.js?v=12"></script>
    <script type="module">
        import { Auth } from './js/auth.js?v=12';
        import { Validators, ErrorHandler } from './js/utils.js?v=12';
        import { icon } from './js/icons.js?v=12';

        document.getElementById('signup-logo').innerHTML = icon('graduationCap', { size: 28 });

        const form = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');

        // إظهار/إخفاء كلمة المرور (بدل خانة "تأكيد كلمة المرور")
        const pwInput = document.getElementById('password');
        document.getElementById('pw-toggle').addEventListener('click', (e) => {
            const show = pwInput.type === 'password';
            pwInput.type = show ? 'text' : 'password';
            e.currentTarget.textContent = show ? 'إخفاء' : 'إظهار';
            e.currentTarget.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
        });

        // اسم المستخدم بيتعمل تلقائيًا من البريد (أحرف إنجليزية وأرقام فقط، 3-20 حرف) مع لاحقة عشوائية
        // عشان مايتكررش — المستخدم مش محتاج يفكر فيه (الدخول بالبريد)
        function autoUsername(email) {
            let base = String(email || '').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 12);
            if (base.length < 3) base = 'teacher';
            const rand = Math.random().toString(36).replace(/[^a-z0-9]/g, '').slice(2, 7).padEnd(5, '0');
            return `${base}_${rand}`.slice(0, 20);
        }

        // تحقق من المستخدم المسجل
        window.addEventListener('load', async () => {
            const session = await Auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // إخفاء الأخطاء السابقة
            document.querySelectorAll('.error').forEach(el => el.style.display = 'none');

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const teachingType = 'private';
            const subject = document.getElementById('subject').value;

            // التحقق من البيانات
            let hasErrors = false;

            if (!name || !Validators.name(name)) {
                document.getElementById('nameError').textContent = 'الاسم يجب أن يكون بين 2 و 100 حرف';
                document.getElementById('nameError').style.display = 'block';
                hasErrors = true;
            }

            if (!email || !Validators.email(email)) {
                document.getElementById('emailError').textContent = 'البريد الإلكتروني غير صحيح';
                document.getElementById('emailError').style.display = 'block';
                hasErrors = true;
            }

            // رقم الهاتف اختياري، بس لو المستخدم كتب رقم، بيتقبل أي رقم دولي
            // (مش مقتصر على الأرقام المصرية فقط) - راجع Validators.phone في utils.js
            if (phone && !Validators.phone(phone)) {
                document.getElementById('phoneError').textContent = 'رقم الهاتف غير صحيح (تأكد إنه يحتوي على أرقام فقط، بطول معقول، مع إمكانية إضافة + ومفتاح الدولة)';
                document.getElementById('phoneError').style.display = 'block';
                hasErrors = true;
            }

            if (!password || !Validators.password(password)) {
                document.getElementById('passwordError').textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل';
                document.getElementById('passwordError').style.display = 'block';
                hasErrors = true;
            }

            if (!subject) {
                document.getElementById('subjectError').textContent = 'اختر المادة';
                document.getElementById('subjectError').style.display = 'block';
                hasErrors = true;
            }

            if (hasErrors) return;

            // عرض حالة التحميل
            submitBtn.disabled = true;
            submitBtn.style.display = 'none';
            loading.style.display = 'block';

            // تنفيذ التسجيل
            const username = autoUsername(email);
            const result = await Auth.signUp(name, email, phone, password, username, teachingType, subject);

            if (result.success) {
                successMessage.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            } else {
                // ============================================================
                // معالجة خاصة لأخطاء اسم المستخدم القادمة من السيرفر
                // ============================================================
                // لو اسم المستخدم مكرر (مثلاً DB بترجع "duplicate key" أو
                // "unique constraint" أو كود Postgres 23505)، بنعرض رسالة
                // واضحة تحت حقل اسم المستخدم نفسه بدل رسالة تقنية عامة في toast
                const errorText = (result.error || '').toString();
                const isUsernameTaken = /username/i.test(errorText) &&
                    (/duplicate|already|exists|unique|مكرر|مستخدم بالفعل|23505/i.test(errorText));
                ErrorHandler.showError(isUsernameTaken ? 'حصلت مشكلة بسيطة أثناء إنشاء الحساب، من فضلك حاول مرة أخرى.' : result.error);
                submitBtn.disabled = false;
                submitBtn.style.display = 'block';
                loading.style.display = 'none';
            }
        });
    </script>
    <script src="js/pwa-install.js?v=12" defer></script>
</body>
</html>
