<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>جدولي - Teachers Manager</title>
    <link rel="stylesheet" href="css/style.css?v=17">
    <link rel="stylesheet" href="css/lessons.css?v=17">
    <!-- PWA: أيقونات التطبيق والبيانات الوصفية اللازمة للتثبيت على الشاشة الرئيسية والدومين -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4B3A5A">
    <style>
        /* ============ جدولي: الحصص + المواعيد الشخصية ============ */
        :root {
            --lesson-bg: #EEE9F3; --lesson-border: #4B3A5A; --lesson-text: #2E2140;
            --now: #D9534F;
            --sticky-top: 0px;
        }
        .cal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
        .cal-head h1 { margin: 0; font-size: 1.5rem; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
        .cal-head p { margin: 0.2rem 0 0; color: var(--text-secondary); font-size: 0.88rem; }
        .cal-add-btn { display: inline-flex; align-items: center; gap: 0.4rem; font-weight: 700; }

        .cal-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
        .wk-nav { display: flex; align-items: center; gap: 0.35rem; }
        .wk-nav .nav-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .wk-nav .nav-btn:hover { background: var(--bg-secondary); }
        .wk-label { font-weight: 700; color: var(--text-primary); min-width: 9.5rem; text-align: center; font-size: 0.95rem; }
        .today-btn { border: 1px solid var(--border); background: var(--card-bg); color: var(--primary); border-radius: 10px; padding: 0 0.85rem; height: 38px; font: inherit; font-weight: 600; cursor: pointer; }
        .seg { display: inline-flex; background: var(--bg-secondary); border-radius: 12px; padding: 3px; gap: 2px; }
        .seg button { border: 0; background: transparent; border-radius: 9px; padding: 0.45rem 0.95rem; font: inherit; font-size: 0.88rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
        .seg button.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 1px 3px rgba(41,37,45,0.12); }

        .cal-legend { display: flex; gap: 0.9rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.75rem; }
        .cal-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
        .cal-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
        .lg-lesson { background: var(--lesson-bg); border: 2px solid var(--lesson-border); }
        .lg-event { background: #F6EAD3; border: 2px solid #C59A4A; }
        .cal-summary { margin-inline-start: auto; font-weight: 600; color: var(--text-primary); }

        /* ---------- عرض اليوم ---------- */
        .day-strip {
            position: sticky; top: var(--sticky-top); z-index: 30;
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
            background: var(--bg-primary); padding: 0.4rem 0 0.6rem;
            border-bottom: 1px solid var(--border);
        }
        .day-strip button {
            border: 1px solid transparent; background: var(--card-bg); border-radius: 12px; padding: 0.45rem 0.1rem 0.4rem;
            display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; font: inherit; color: var(--text-primary);
            min-width: 0;
        }
        .day-strip .ds-name { font-size: 0.72rem; color: var(--text-secondary); white-space: nowrap; }
        .day-strip .ds-num { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
        .day-strip .ds-dots { display: flex; gap: 3px; height: 6px; margin-top: 2px; }
        .day-strip .ds-dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
        .ds-dots .d-l { background: var(--lesson-border); }
        .ds-dots .d-e { background: #C59A4A; }
        .day-strip button.is-today { border-color: var(--secondary); }
        .day-strip button.is-today .ds-name { color: var(--secondary); font-weight: 700; }
        .day-strip button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .day-strip button.active .ds-name { color: rgba(255,255,255,0.85); }
        .day-strip button.active .d-l { background: #fff; }

        .day-title { display: flex; justify-content: space-between; align-items: center; margin: 0.9rem 0 0.6rem; gap: 0.5rem; }
        .day-title h2 { margin: 0; font-size: 1.05rem; color: var(--text-primary); }
        .day-title small { color: var(--text-secondary); font-size: 0.82rem; }

        .agenda { display: flex; flex-direction: column; gap: 0.55rem; }
        .ag-item {
            display: grid; grid-template-columns: 4.6rem 1fr auto; align-items: center; gap: 0.75rem;
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 0.7rem 0.85rem;
            border-inline-start: 5px solid var(--lesson-border); cursor: pointer; text-align: start; font: inherit; width: 100%; color: inherit;
        }
        .ag-item:hover { box-shadow: 0 2px 10px rgba(41,37,45,0.08); }
        .ag-item.is-past { opacity: 0.6; }
        .ag-time { display: flex; flex-direction: column; line-height: 1.25; }
        .ag-time b { font-size: 0.98rem; color: var(--text-primary); white-space: nowrap; }
        .ag-time small { font-size: 0.74rem; color: var(--text-secondary); white-space: nowrap; }
        .ag-main { min-width: 0; }
        .ag-title { font-weight: 700; font-size: 0.97rem; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ag-sub { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ag-tag { font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 999px; white-space: nowrap; }
        .tag-lesson { background: var(--lesson-bg); color: var(--lesson-text); }
        .ag-now { display: flex; align-items: center; gap: 0.5rem; color: var(--now); font-size: 0.75rem; font-weight: 700; margin: 0.1rem 0; }
        .ag-now::before, .ag-now::after { content: ''; height: 2px; background: var(--now); flex: 1; border-radius: 2px; }
        .ag-empty { text-align: center; background: var(--card-bg); border: 1px dashed var(--border); border-radius: 14px; padding: 1.6rem 1rem; color: var(--text-secondary); }
        .ag-empty p { margin: 0 0 0.9rem; }
        .ag-empty .btns { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }

        /* ---------- عرض الأسبوع ---------- */
        .wk-scroll {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
            overflow: auto; max-height: calc(100dvh - 230px); min-height: 360px;
            overscroll-behavior: contain; position: relative;
        }
        .wk-grid { display: grid; grid-template-columns: 54px repeat(7, minmax(104px, 1fr)); min-width: 780px; position: relative; }
        .wk-corner, .wk-dayhead { position: sticky; top: 0; z-index: 20; background: var(--card-bg); border-bottom: 2px solid var(--border); height: 52px; box-sizing: border-box; }
        .wk-corner { inset-inline-start: 0; z-index: 25; border-inline-end: 1px solid var(--border); }
        .wk-dayhead { display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border-inline-start: 1px solid var(--border); }
        .wk-dayhead b { font-size: 0.85rem; color: var(--text-primary); }
        .wk-dayhead small { font-size: 0.74rem; color: var(--text-secondary); }
        .wk-dayhead.is-today b { color: #fff; background: var(--secondary); border-radius: 999px; padding: 0 0.55rem; }
        .wk-timecol { position: sticky; inset-inline-start: 0; z-index: 15; background: var(--card-bg); border-inline-end: 1px solid var(--border); }
        .wk-hour { position: absolute; inset-inline: 0; font-size: 0.7rem; color: var(--text-secondary); text-align: center; transform: translateY(-50%); white-space: nowrap; }
        .wk-col { position: relative; border-inline-start: 1px solid var(--border); cursor: copy; }
        .wk-col.is-today { background-color: rgba(197,154,74,0.06); }
        .wk-block {
            position: absolute; border-radius: 9px; padding: 3px 6px; overflow: hidden; cursor: pointer; box-sizing: border-box;
            font-size: 0.74rem; line-height: 1.3; border: 1px solid; border-inline-start-width: 4px; text-align: start;
            font-family: inherit;
        }
        .wk-block b { display: block; font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wk-block span { display: block; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .wk-block:hover { filter: brightness(0.97); z-index: 6; }
        .wk-now { position: absolute; inset-inline: 0; height: 2px; background: var(--now); z-index: 8; pointer-events: none; }
        .wk-now::before { content: ''; position: absolute; inset-inline-start: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
        .wk-hint { font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.5rem; }

        /* ---------- النافذة ---------- */
        .ev-modal .modal-content { max-width: 480px; position: relative; }
        .ev-modal .form-group { margin-bottom: 1rem; }
        .ev-modal .form-group > label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
        .type-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 1rem; }
        .type-seg button { border: 2px solid var(--border); background: var(--card-bg); border-radius: 12px; padding: 0.65rem 0.4rem; font: inherit; font-weight: 700; cursor: pointer; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .type-seg button small { font-weight: 400; font-size: 0.74rem; }
        .type-seg button.active[data-type="lesson"] { border-color: var(--lesson-border); background: var(--lesson-bg); color: var(--lesson-text); }
        .type-seg button.active[data-type="event"] { border-color: #C59A4A; background: #F6EAD3; color: #6B4E17; }
        .rec-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg-secondary); padding: 3px; border-radius: 12px; }
        .rec-seg button { border: 0; background: transparent; border-radius: 9px; padding: 0.5rem 0.2rem; font: inherit; font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
        .rec-seg button.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 1px 3px rgba(41,37,45,0.12); }
        .quick-titles { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-top: 0.45rem; }
        .quick-titles button { border: 1px solid var(--border); background: var(--card-bg); border-radius: 999px; padding: 0.3rem 0.7rem; font: inherit; font-size: 0.8rem; cursor: pointer; color: var(--text-primary); }
        .color-row { display: flex; gap: 0.5rem; }
        .color-row button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0; }
        .color-row button.active { border-color: var(--text-primary); }
        .conflict-box { display: none; background: #FFF4E5; border: 1px solid #F1D3A6; color: #7A4B12; border-radius: 10px; padding: 0.6rem 0.8rem; font-size: 0.84rem; margin: 0.4rem 0 0.2rem; line-height: 1.6; }
        .ev-actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
        .ev-actions .btn { flex: 1 1 auto; }
        .btn-danger-soft { background: transparent !important; color: var(--danger) !important; border: 1px solid #F0CFCF !important; }
        .add-chooser { display: grid; gap: 0.6rem; }
        .add-chooser button { display: flex; align-items: center; gap: 0.8rem; text-align: start; border: 1px solid var(--border); background: var(--card-bg); border-radius: 14px; padding: 0.9rem 1rem; cursor: pointer; font: inherit; color: var(--text-primary); }
        .add-chooser button i { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 1.2rem; flex-shrink: 0; }
        .add-chooser b { display: block; }
        .add-chooser small { color: var(--text-secondary); }

        @media (max-width: 900px) {
            /* الموبايل: العنوان موجود في الهيدر فوق، وزرار الإضافة بقى زرار عائم فوق شريط التنقل */
            .cal-head { margin-bottom: 0; }
            .cal-head > div { display: none; }
            .cal-add-btn {
                position: fixed; z-index: 400; inset-inline-end: 16px;
                bottom: calc(80px + env(safe-area-inset-bottom, 0px));
                width: 56px; height: 56px; border-radius: 50%; padding: 0; justify-content: center;
                box-shadow: 0 8px 22px rgba(75,58,90,0.35); font-size: 0;
            }
            .cal-add-btn svg { width: 24px; height: 24px; }
            .wk-scroll { max-height: calc(100dvh - 210px - 68px); min-height: 320px; }
            .cal-summary { margin-inline-start: 0; width: 100%; }
            .agenda { padding-bottom: 72px; }
        }
        @media (max-width: 480px) {
            .wk-label { min-width: 0; font-size: 0.88rem; }
            .cal-toolbar { gap: 0.45rem; }
            .seg button { padding: 0.45rem 0.75rem; }
            .ag-item { grid-template-columns: 4.1rem 1fr; }
            .ag-item .ag-tag { display: none; }
            .day-strip .ds-name { font-size: 0.66rem; }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXC2WZMT"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="app-shell">
        <div id="sidebar-root"></div>
        <main class="main-content">
            <div id="top-header-root"></div>
            <div class="page-body">
                <div class="cal-head">
                    <div>
                        <h1><span id="ic-page-title" class="icon" style="display:inline-flex;"></span> جدولي</h1>
                        <p>حصصك ومواعيدك كلها في مكان واحد</p>
                    </div>
                    <button type="button" class="btn cal-add-btn" id="btn-add" aria-label="إضافة حصة أو موعد"><span id="ic-add" style="display:inline-flex"></span> إضافة</button>
                </div>

                <div class="cal-toolbar">
                    <div class="wk-nav">
                        <button type="button" class="nav-btn" id="nav-prev" aria-label="الأسبوع اللي فات"></button>
                        <span class="wk-label" id="wk-label"></span>
                        <button type="button" class="nav-btn" id="nav-next" aria-label="الأسبوع الجاي"></button>
                        <button type="button" class="today-btn" id="nav-today">النهارده</button>
                    </div>
                    <div class="seg" role="tablist" aria-label="طريقة العرض">
                        <button type="button" data-view="day">اليوم</button>
                        <button type="button" data-view="week">الأسبوع</button>
                    </div>
                </div>

                <div class="cal-legend">
                    <span><i class="lg-lesson"></i> حصة</span>
                    <span><i class="lg-event"></i> موعد شخصي</span>
                    <span class="cal-summary" id="cal-summary"></span>
                </div>

                <div id="cal-loading" class="loading">جاري تحميل الجدول...</div>

                <section id="view-day" hidden>
                    <div class="day-strip" id="day-strip" role="tablist" aria-label="أيام الأسبوع"></div>
                    <div class="day-title"><h2 id="day-title"></h2><small id="day-count"></small></div>
                    <div class="agenda" id="agenda"></div>
                </section>

                <section id="view-week" hidden>
                    <div class="wk-scroll" id="wk-scroll"><div class="wk-grid" id="wk-grid"></div></div>
                    <p class="wk-hint">اضغط على أي مكان فاضي في الجدول عشان تضيف حصة أو موعد في الوقت ده.</p>
                </section>
            </div>
        </main>
    </div>

    <!-- اختيار نوع الإضافة -->
    <div class="modal ev-modal" id="chooser-modal">
        <div class="modal-content">
            <span class="close-modal" data-close>&times;</span>
            <h2 style="margin-top:0;">تضيف إيه؟</h2>
            <div class="add-chooser">
                <button type="button" data-choose="lesson"><i style="background:var(--lesson-bg); color:var(--lesson-text);">📚</i><span><b>حصة لطالب</b><small>ميعاد ثابت لطالب من طلابك</small></span></button>
                <button type="button" data-choose="event"><i style="background:#F6EAD3; color:#6B4E17;">📌</i><span><b>موعد شخصي</b><small>دكتور، مشوار، اجتماع، رياضة... أي حاجة مش حصة</small></span></button>
            </div>
        </div>
    </div>

    <!-- إضافة / تعديل (حصة أو موعد شخصي) -->
    <div class="modal ev-modal" id="item-modal">
        <div class="modal-content">
            <span class="close-modal" data-close>&times;</span>
            <h2 id="item-title" style="margin-top:0;">إضافة</h2>
            <form id="item-form" novalidate>
                <div class="type-seg" id="type-seg">
                    <button type="button" data-type="lesson">📚 حصة<small>لطالب</small></button>
                    <button type="button" data-type="event">📌 موعد شخصي<small>مش حصة</small></button>
                </div>

                <!-- حصة -->
                <div id="lesson-fields">
                    <div class="form-group">
                        <label for="f-student">الطالب *</label>
                        <select id="f-student"></select>
                        <small class="day-chips-hint" id="no-students" hidden>لسه مفيش طلاب. <a href="students.html?action=add">ضيف طالب الأول</a></small>
                    </div>
                </div>

                <!-- موعد شخصي -->
                <div id="event-fields">
                    <div class="form-group">
                        <label for="f-title">اسم الموعد *</label>
                        <input type="text" id="f-title" maxlength="120" placeholder="مثلًا: دكتور الأسنان" autocomplete="off">
                        <div class="quick-titles" id="quick-titles"></div>
                    </div>
                    <div class="form-group">
                        <label for="f-note">ملاحظة <small style="font-weight:400; color:var(--text-secondary);">(اختياري)</small></label>
                        <input type="text" id="f-note" maxlength="300" placeholder="مثلًا: العنوان أو رقم التليفون">
                    </div>
                    <div class="form-group">
                        <label>اللون</label>
                        <div class="color-row" id="color-row"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>بيتكرر؟</label>
                    <div class="rec-seg" id="rec-seg">
                        <button type="button" data-rec="weekly">كل أسبوع</button>
                        <button type="button" data-rec="none">مرة واحدة</button>
                        <button type="button" data-rec="daily">كل يوم</button>
                        <button type="button" data-rec="monthly">كل شهر</button>
                    </div>
                </div>

                <div class="form-group" id="days-group">
                    <label id="days-label">الأيام *</label>
                    <div id="f-days"></div>
                    <small class="day-chips-hint" id="days-hint">اختار كل الأيام اللي بيتكرر فيها في نفس الميعاد</small>
                </div>
                <div class="form-group" id="date-group">
                    <label for="f-date">التاريخ *</label>
                    <input type="date" id="f-date">
                </div>

                <div class="form-group">
                    <label>الساعة *</label>
                    <input type="time" id="f-time" value="16:00">
                </div>
                <div class="form-group">
                    <label for="f-duration">المدة *</label>
                    <select id="f-duration">
                        <option value="15">ربع ساعة</option>
                        <option value="30">نص ساعة</option>
                        <option value="45">45 دقيقة</option>
                        <option value="60">ساعة</option>
                        <option value="90">ساعة ونص</option>
                        <option value="120">ساعتين</option>
                        <option value="180">3 ساعات</option>
                        <option value="240">4 ساعات</option>
                    </select>
                </div>

                <div class="conflict-box" id="conflict-box" role="status"></div>

                <div class="ev-actions">
                    <button type="submit" class="btn" id="btn-save">حفظ</button>
                    <button type="button" class="btn btn-ghost" data-close>إلغاء</button>
                </div>
                <div class="ev-actions" id="delete-actions" hidden>
                    <button type="button" class="btn btn-danger-soft" id="btn-delete">حذف</button>
                    <button type="button" class="btn btn-danger-soft" id="btn-delete-group" hidden>حذف من كل الأيام</button>
                </div>
            </form>
        </div>
    </div>

    <div id="error-toast" style="display:none;"></div>
    <div id="success-toast" style="display:none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config.js?v=17"></script>
    <script type="module">
        import { Auth } from './js/auth.js?v=17';
        import { api } from './js/api.js?v=17';
        import { ErrorHandler, Formatters } from './js/utils.js?v=17';
        import { renderSidebar, renderTopHeader } from './js/sidebar.js?v=17';
        import { icon } from './js/icons.js?v=17';
        import { mountTimePicker, refreshTimePicker, mountDayChips } from './js/form-widgets.js?v=17';
        import {
            DAY_NAMES, DAY_SHORT, EVENT_COLORS, isoDate, parseDate, weekStart, addDays, sameDay, weekDays,
            minutesToTime, formatClock12, formatRange, durationText, formatDayDate, occursOn,
            lessonItem, eventItem, itemsOn, layoutLanes, findConflicts
        } from './js/calendar-utils.js?v=17';

        renderSidebar('schedule');
        renderTopHeader({ title: 'جدولي', subtitle: 'حصصك ومواعيدك في مكان واحد' });
        document.getElementById('ic-page-title').innerHTML = icon('calendar', { size: 22 });
        document.getElementById('ic-add').innerHTML = icon('plus', { size: 16 });
        // في الواجهة العربية (RTL): "اللي فات" على اليمين و"الجاي" على الشمال
        document.getElementById('nav-prev').innerHTML = icon('chevronRight', { size: 18 });
        document.getElementById('nav-next').innerHTML = icon('chevronLeft', { size: 18 });

        const $ = (id) => document.getElementById(id);
        const esc = (s) => Formatters.escapeHtml(s == null ? '' : String(s));
        const LS = {
            get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* تجاهل */ } }
        };
        const track = (event, extra = {}) => { try { (window.dataLayer = window.dataLayer || []).push({ event, ...extra }); } catch (e) { /* تجاهل */ } };
        const REC_LABEL = { weekly: 'كل أسبوع', daily: 'كل يوم', monthly: 'كل شهر', none: 'مرة واحدة' };
        const QUICK_TITLES = ['دكتور', 'اجتماع', 'مشوار', 'رياضة', 'تحضير دروس', 'مناسبة'];
        const HOUR_PX = 56;

        // ------------------------------------------------------------ الحالة
        let students = [];
        let schedules = [];
        let events = [];
        let eventsAvailable = true;
        let items = [];
        let view = LS.get('tm_cal_view') || (window.matchMedia('(max-width: 900px)').matches ? 'day' : 'week');
        let selected = new Date(); selected.setHours(0, 0, 0, 0);
        let wStart = weekStart(selected);

        function rebuildItems() {
            const nameOf = new Map(students.map((s) => [String(s.id), s.name]));
            items = [
                ...schedules.map((s) => lessonItem(s, nameOf.get(String(s.student_id)))),
                ...events.map(eventItem)
            ];
        }

        // ------------------------------------------------------------ التحميل
        async function loadData() {
            try {
                const [studentsData, schedulesData, ev] = await Promise.all([
                    api.getAllStudents(),
                    api.getSchedules(),
                    api.getPersonalEvents().catch(() => null)
                ]);
                students = studentsData.students || [];
                schedules = schedulesData.schedules || [];
                eventsAvailable = ev !== null;
                events = ev || [];
                rebuildItems();
                $('cal-loading').style.display = 'none';
                render();
            } catch (err) {
                const ld = $('cal-loading');
                ld.style.display = '';
                ld.innerHTML = `${esc(ErrorHandler.getErrorMessage(err))} <button type="button" class="btn btn-sm" id="cal-retry">حاول تاني</button>`;
                $('cal-retry').addEventListener('click', () => { ld.textContent = 'جاري تحميل الجدول...'; loadData(); });
            }
        }

        // ------------------------------------------------------------ العرض العام
        function render() {
            const days = weekDays(wStart);
            const end = days[6];
            const sameMonth = wStart.getMonth() === end.getMonth();
            $('wk-label').textContent = sameMonth
                ? `${wStart.getDate().toLocaleString('ar-EG')} – ${formatDayDate(end, { day: 'numeric', month: 'long' })}`
                : `${formatDayDate(wStart, { day: 'numeric', month: 'short' })} – ${formatDayDate(end, { day: 'numeric', month: 'short' })}`;
            let lessons = 0, evs = 0;
            days.forEach((d) => itemsOn(items, d).forEach((it) => { if (it.kind === 'lesson') lessons++; else evs++; }));
            const lw = (n) => n === 1 ? 'حصة واحدة' : n === 2 ? 'حصتين' : n <= 10 ? `${n} حصص` : `${n} حصة`;
            const ew = (n) => n === 1 ? 'موعد واحد' : n === 2 ? 'موعدين' : n <= 10 ? `${n} مواعيد` : `${n} موعد`;
            $('cal-summary').textContent = (lessons || evs) ? `الأسبوع ده: ${[lessons ? lw(lessons) : '', evs ? ew(evs) : ''].filter(Boolean).join(' · ')}` : 'الأسبوع ده فاضي';
            document.querySelectorAll('.seg [data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
            $('view-day').hidden = view !== 'day';
            $('view-week').hidden = view !== 'week';
            if (view === 'day') renderDay(); else renderWeek();
        }

        function itemColors(it) {
            if (it.kind === 'lesson') return { bg: 'var(--lesson-bg)', border: 'var(--lesson-border)', text: 'var(--lesson-text)' };
            return EVENT_COLORS[it.color] || EVENT_COLORS.gold;
        }
        function itemSub(it) {
            const parts = [it.kind === 'lesson' ? 'حصة' : 'موعد شخصي', durationText(it.duration)];
            if (it.recurrence_type !== 'weekly') parts.push(REC_LABEL[it.recurrence_type] || '');
            if (it.kind === 'event' && it.note) parts.push(it.note);
            return parts.filter(Boolean).join(' · ');
        }

        // ------------------------------------------------------------ عرض اليوم
        function renderDay() {
            const today = new Date();
            const days = weekDays(wStart);
            if (!days.some((d) => sameDay(d, selected))) selected = sameDay(wStart, weekStart(today)) ? new Date(today.getFullYear(), today.getMonth(), today.getDate()) : wStart;
            $('day-strip').innerHTML = days.map((d) => {
                const list = itemsOn(items, d);
                const nL = list.filter((x) => x.kind === 'lesson').length;
                const nE = list.length - nL;
                const dots = `${nL ? '<i class="d-l"></i>' : ''}${nE ? '<i class="d-e"></i>' : ''}`;
                return `<button type="button" role="tab" data-date="${isoDate(d)}" class="${sameDay(d, selected) ? 'active' : ''} ${sameDay(d, today) ? 'is-today' : ''}"
                        aria-selected="${sameDay(d, selected)}" aria-label="${esc(formatDayDate(d))}: ${list.length ? list.length + ' مواعيد' : 'فاضي'}">
                    <span class="ds-name">${DAY_SHORT[d.getDay()]}</span>
                    <span class="ds-num">${d.getDate().toLocaleString('ar-EG')}</span>
                    <span class="ds-dots">${dots}</span>
                </button>`;
            }).join('');

            const list = itemsOn(items, selected);
            $('day-title').textContent = sameDay(selected, today) ? `النهارده، ${formatDayDate(selected, { day: 'numeric', month: 'long' })}` : formatDayDate(selected);
            const nL = list.filter((x) => x.kind === 'lesson').length;
            const nE = list.length - nL;
            $('day-count').textContent = list.length ? [nL ? `${nL} ${nL === 1 ? 'حصة' : 'حصص'}` : '', nE ? `${nE} ${nE === 1 ? 'موعد' : 'مواعيد'}` : ''].filter(Boolean).join(' · ') : '';

            const ag = $('agenda');
            if (!list.length) {
                ag.innerHTML = `<div class="ag-empty"><p>مفيش حصص ولا مواعيد في اليوم ده.</p>
                    <div class="btns"><button type="button" class="btn btn-sm" data-empty="lesson">+ حصة</button>
                    <button type="button" class="btn btn-sm btn-ghost" data-empty="event">+ موعد شخصي</button></div></div>`;
                return;
            }
            const isToday = sameDay(selected, today);
            const nowMin = today.getHours() * 60 + today.getMinutes();
            let nowPlaced = !isToday;
            let html = '';
            list.forEach((it, i) => {
                if (!nowPlaced && it.start > nowMin) { html += `<div class="ag-now">دلوقتي ${formatClock12(nowMin)}</div>`; nowPlaced = true; }
                const c = itemColors(it);
                const past = isToday && it.start + it.duration <= nowMin;
                html += `<button type="button" class="ag-item ${past ? 'is-past' : ''}" data-idx="${i}" style="border-inline-start-color:${c.border}">
                    <span class="ag-time"><b>${formatClock12(it.start)}</b><small>لحد ${formatClock12(it.start + it.duration)}</small></span>
                    <span class="ag-main"><span class="ag-title" style="display:block">${it.kind === 'event' ? '📌 ' : ''}${esc(it.title)}</span><span class="ag-sub" style="display:block">${esc(itemSub(it))}</span></span>
                    <span class="ag-tag ${it.kind === 'lesson' ? 'tag-lesson' : ''}" style="${it.kind === 'event' ? `background:${c.bg};color:${c.text}` : ''}">${it.kind === 'lesson' ? 'حصة' : 'موعد'}</span>
                </button>`;
            });
            ag.innerHTML = html;
            ag._list = list;
            // أول مرة: لو اليوم ده النهارده واليوم زحمة، ننزل لحد "دلوقتي"
            if (isToday && !ag._autoScrolled) {
                ag._autoScrolled = true;
                const now = ag.querySelector('.ag-now');
                if (now && now.getBoundingClientRect().top > window.innerHeight * 0.75) {
                    setTimeout(() => now.scrollIntoView({ block: 'center', behavior: 'smooth' }), 150);
                }
            }
        }

        $('day-strip').addEventListener('click', (e) => {
            const b = e.target.closest('button[data-date]');
            if (!b) return;
            selected = parseDate(b.dataset.date);
            renderDay();
        });
        $('agenda').addEventListener('click', (e) => {
            const emptyBtn = e.target.closest('[data-empty]');
            if (emptyBtn) { openItemModal({ type: emptyBtn.dataset.empty, date: selected }); return; }
            const row = e.target.closest('.ag-item');
            if (!row) return;
            const it = ($('agenda')._list || [])[Number(row.dataset.idx)];
            if (it) openItemModal({ edit: it });
        });

        // ------------------------------------------------------------ عرض الأسبوع
        function renderWeek() {
            const days = weekDays(wStart);
            const today = new Date();
            const weekItems = days.map((d) => itemsOn(items, d));
            // نطاق الساعات: من 8 الصبح لـ 10 بالليل، ويتوسع لو فيه مواعيد برا النطاق ده
            let minM = 8 * 60, maxM = 22 * 60;
            weekItems.flat().forEach((it) => { minM = Math.min(minM, Math.floor(it.start / 60) * 60); maxM = Math.max(maxM, Math.ceil((it.start + it.duration) / 60) * 60); });
            maxM = Math.min(maxM, 24 * 60);
            const hours = (maxM - minM) / 60;
            const height = hours * HOUR_PX;
            const lines = `repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 1px, transparent 1px, transparent ${HOUR_PX / 2}px, rgba(231,225,232,0.45) ${HOUR_PX / 2}px, rgba(231,225,232,0.45) ${HOUR_PX / 2 + 1}px, transparent ${HOUR_PX / 2 + 1}px, transparent ${HOUR_PX}px)`;

            let html = `<div class="wk-corner" style="grid-row:1; grid-column:1"></div>`;
            days.forEach((d, i) => {
                html += `<div class="wk-dayhead ${sameDay(d, today) ? 'is-today' : ''}" style="grid-row:1; grid-column:${i + 2}" data-date="${isoDate(d)}" title="اعرض اليوم ده">
                    <b>${DAY_NAMES[d.getDay()]}</b><small>${formatDayDate(d, { day: 'numeric', month: 'short' })}</small></div>`;
            });
            html += `<div class="wk-timecol" style="grid-row:2; grid-column:1; height:${height}px">`;
            for (let h = 1; h < hours; h++) html += `<span class="wk-hour" style="top:${h * HOUR_PX}px">${formatClock12(minM + h * 60).replace(':00', '')}</span>`;
            html += `</div>`;
            days.forEach((d, i) => {
                const isToday = sameDay(d, today);
                html += `<div class="wk-col ${isToday ? 'is-today' : ''}" style="grid-row:2; grid-column:${i + 2}; height:${height}px; background-image:${lines}" data-date="${isoDate(d)}">`;
                layoutLanes(weekItems[i]).forEach((it) => {
                    const c = itemColors(it);
                    const top = (it.start - minM) / 60 * HOUR_PX;
                    const h = Math.max(22, it.duration / 60 * HOUR_PX - 2);
                    const w = 100 / it.lanes;
                    const idx = weekItems[i].findIndex((x) => x.kind === it.kind && x.id === it.id);
                    html += `<button type="button" class="wk-block" data-day="${i}" data-idx="${idx}"
                        style="top:${top + 1}px; height:${h}px; inset-inline-start:calc(${it.lane * w}% + 2px); width:calc(${w}% - 4px); background:${c.bg}; border-color:${c.border}; color:${c.text}"
                        title="${esc(it.title)} · ${esc(formatRange(it.start, it.duration))}">
                        <b>${it.kind === 'event' ? '📌 ' : ''}${esc(it.title)}</b>${h >= 36 ? `<span>${esc(formatRange(it.start, it.duration))}</span>` : ''}</button>`;
                });
                if (isToday) {
                    const nowMin = today.getHours() * 60 + today.getMinutes();
                    if (nowMin >= minM && nowMin <= maxM) html += `<div class="wk-now" style="top:${(nowMin - minM) / 60 * HOUR_PX}px"></div>`;
                }
                html += `</div>`;
            });
            const grid = $('wk-grid');
            grid.innerHTML = html;
            grid._weekItems = weekItems;
            grid._minM = minM;

            // أول مرة: نسكرول لحد أول موعد في الأسبوع (أو الساعة الحالية)
            const scroller = $('wk-scroll');
            if (!scroller._scrolled) {
                const first = weekItems.flat().reduce((m, it) => Math.min(m, it.start), 24 * 60);
                const target = Math.min(first, today.getHours() * 60) - 30;
                scroller.scrollTop = Math.max(0, (target - minM) / 60 * HOUR_PX);
                scroller._scrolled = true;
            }
        }

        $('wk-grid').addEventListener('click', (e) => {
            const grid = $('wk-grid');
            const block = e.target.closest('.wk-block');
            if (block) {
                const it = grid._weekItems[Number(block.dataset.day)][Number(block.dataset.idx)];
                if (it) openItemModal({ edit: it });
                return;
            }
            const head = e.target.closest('.wk-dayhead');
            if (head) { selected = parseDate(head.dataset.date); setView('day'); return; }
            const col = e.target.closest('.wk-col');
            if (!col) return;
            const y = e.clientY - col.getBoundingClientRect().top;
            const minute = grid._minM + Math.floor((y / HOUR_PX) * 2) * 30;   // أقرب نص ساعة
            openChooser({ date: parseDate(col.dataset.date), start: minute });
        });

        // ------------------------------------------------------------ التنقل
        function setView(v) {
            view = v;
            LS.set('tm_cal_view', v);
            if (v === 'day' && !weekDays(wStart).some((d) => sameDay(d, selected))) selected = wStart;
            wStart = weekStart(selected);
            render();
        }
        document.querySelectorAll('.seg [data-view]').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
        $('nav-prev').addEventListener('click', () => { wStart = addDays(wStart, -7); selected = addDays(selected, -7); render(); });
        $('nav-next').addEventListener('click', () => { wStart = addDays(wStart, 7); selected = addDays(selected, 7); render(); });
        $('nav-today').addEventListener('click', () => {
            const t = new Date(); selected = new Date(t.getFullYear(), t.getMonth(), t.getDate());
            wStart = weekStart(selected);
            $('wk-scroll')._scrolled = false;
            render();
        });

        // ------------------------------------------------------------ النوافذ
        document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('.modal').classList.remove('active')));
        document.querySelectorAll('.modal').forEach((m) => m.addEventListener('mousedown', (e) => { if (e.target === m) m.classList.remove('active'); }));

        let chooserCtx = {};
        function openChooser(ctx = {}) {
            chooserCtx = ctx;
            $('chooser-modal').classList.add('active');
        }
        $('chooser-modal').addEventListener('click', (e) => {
            const b = e.target.closest('[data-choose]');
            if (!b) return;
            $('chooser-modal').classList.remove('active');
            openItemModal({ ...chooserCtx, type: b.dataset.choose });
        });
        $('btn-add').addEventListener('click', () => openChooser({ date: view === 'day' ? selected : (weekDays(wStart).find((d) => sameDay(d, new Date())) || wStart) }));

        // عناصر النموذج
        mountTimePicker($('f-time'));
        const dayChips = mountDayChips($('f-days'), { multi: true, onChange: updateConflicts });
        $('color-row').innerHTML = Object.entries(EVENT_COLORS).map(([k, c]) => `<button type="button" data-color="${k}" aria-label="${c.label}" title="${c.label}" style="background:${c.bg}; box-shadow: inset 0 0 0 2px ${c.border}"></button>`).join('');
        $('quick-titles').innerHTML = QUICK_TITLES.map((t) => `<button type="button">${t}</button>`).join('');
        $('quick-titles').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { $('f-title').value = b.textContent; $('f-title').focus(); } });

        let form = {};   // { mode: 'add'|'edit', type, rec, color, editItem }
        function setType(type) {
            form.type = type;
            document.querySelectorAll('#type-seg [data-type]').forEach((b) => b.classList.toggle('active', b.dataset.type === type));
            $('lesson-fields').hidden = type !== 'lesson';
            $('event-fields').hidden = type !== 'event';
            if (type === 'event' && !eventsAvailable) {
                ErrorHandler.showError('المواعيد الشخصية مش متاحة دلوقتي. جرّب تاني بعد شوية.');
            }
            updateConflicts();
        }
        function setRec(rec) {
            form.rec = rec;
            document.querySelectorAll('#rec-seg [data-rec]').forEach((b) => b.classList.toggle('active', b.dataset.rec === rec));
            const editing = form.mode === 'edit';
            const needDays = rec === 'weekly' || (rec === 'daily' && editing);
            $('days-group').hidden = !needDays;
            $('date-group').hidden = !(rec === 'none' || rec === 'monthly');
            $('days-label').textContent = editing ? 'اليوم *' : 'الأيام *';
            $('days-hint').hidden = editing;
            updateConflicts();
        }
        function setColor(color) {
            form.color = EVENT_COLORS[color] ? color : 'gold';
            document.querySelectorAll('#color-row [data-color]').forEach((b) => b.classList.toggle('active', b.dataset.color === form.color));
        }
        document.querySelectorAll('#type-seg [data-type]').forEach((b) => b.addEventListener('click', () => {
            if (form.mode === 'edit') return;
            setType(b.dataset.type);
            setRec(b.dataset.type === 'event' ? 'none' : 'weekly');
        }));
        document.querySelectorAll('#rec-seg [data-rec]').forEach((b) => b.addEventListener('click', () => setRec(b.dataset.rec)));
        document.querySelectorAll('#color-row [data-color]').forEach((b) => b.addEventListener('click', () => setColor(b.dataset.color)));
        ['f-date', 'f-time', 'f-duration', 'f-student'].forEach((id) => $(id).addEventListener('change', updateConflicts));

        function fillStudents(selectedId) {
            const sel = $('f-student');
            sel.innerHTML = students.map((s) => `<option value="${esc(s.id)}">${esc(s.name || '')}</option>`).join('');
            if (selectedId) sel.value = selectedId;
            $('no-students').hidden = students.length > 0;
        }

        /**
         * ctx: { type, date, start } للإضافة — أو { edit: item } للتعديل
         */
        function openItemModal(ctx = {}) {
            const it = ctx.edit || null;
            form = { mode: it ? 'edit' : 'add', editItem: it };
            $('type-seg').hidden = !!it;
            $('delete-actions').hidden = !it;
            $('btn-delete-group').hidden = !(it && it.group && items.filter((x) => x.kind === it.kind && x.group === it.group).length > 1);
            $('btn-delete').textContent = it ? (it.kind === 'lesson' ? 'حذف الموعد ده' : 'حذف') : 'حذف';

            if (it) {
                $('item-title').textContent = it.kind === 'lesson' ? `تعديل حصة ${it.title}` : 'تعديل الموعد';
                setType(it.kind);
                fillStudents(it.student_id);
                $('f-title').value = it.kind === 'event' ? it.title : '';
                $('f-note').value = it.note || '';
                setColor(it.kind === 'event' ? it.color : 'gold');
                dayChips.setMulti(false);
                dayChips.set([it.day_of_week]);
                $('f-date').value = it.start_date ? String(it.start_date).slice(0, 10) : isoDate(selected);
                $('f-time').value = minutesToTime(it.start);
                const dur = $('f-duration');
                if (![...dur.options].some((o) => Number(o.value) === it.duration)) dur.add(new Option(durationText(it.duration), String(it.duration)));
                dur.value = String(it.duration);
                setRec(it.recurrence_type);
            } else {
                const type = ctx.type || 'lesson';
                const date = ctx.date || selected;
                const now = new Date();
                const start = ctx.start != null ? ctx.start : Math.min(23 * 60, (now.getHours() + 1) * 60);
                $('item-title').textContent = type === 'lesson' ? 'حصة جديدة' : 'موعد شخصي جديد';
                fillStudents(new URLSearchParams(location.search).get('add_student'));
                $('f-title').value = '';
                $('f-note').value = '';
                setColor('gold');
                dayChips.setMulti(true);
                dayChips.set([date.getDay()]);
                $('f-date').value = isoDate(date);
                $('f-time').value = minutesToTime(start);
                $('f-duration').value = type === 'lesson' ? '45' : '60';
                setType(type);
                setRec(type === 'event' ? 'none' : 'weekly');
            }
            refreshTimePicker($('f-time'));
            updateConflicts();
            $('item-modal').classList.add('active');
            if (form.type === 'event' && !it) setTimeout(() => $('f-title').focus(), 80);
        }

        function currentTarget() {
            const [h, m] = ($('f-time').value || '16:00').split(':').map(Number);
            return {
                start: h * 60 + m,
                duration: parseInt($('f-duration').value, 10) || 45,
                recurrence_type: form.rec,
                days: form.rec === 'daily' && form.mode === 'add' ? [0, 1, 2, 3, 4, 5, 6] : dayChips.get(),
                date: $('f-date').value
            };
        }
        function updateConflicts() {
            const box = $('conflict-box');
            if (!form.type) { box.style.display = 'none'; return; }
            const t = currentTarget();
            const exclude = form.editItem ? `${form.editItem.kind}:${form.editItem.id}` : '';
            const list = findConflicts(items, t, exclude).slice(0, 3);
            if (!list.length) { box.style.display = 'none'; box.innerHTML = ''; return; }
            box.innerHTML = '⚠️ بيتعارض مع: ' + list.map((it) => `${it.kind === 'lesson' ? 'حصة' : 'موعد'} <b>${esc(it.title)}</b> (${DAY_NAMES[it.day_of_week]} ${esc(formatRange(it.start, it.duration))})`).join('، ')
                + (form.type === 'lesson' && list.some((x) => x.kind === 'lesson') ? '<br><small>الحصص اللي بتتعارض مع حصة تانية مش هتتحفظ.</small>' : '<br><small>تقدر تحفظ عادي لو ده مقصود.</small>');
            box.style.display = 'block';
        }

        // ------------------------------------------------------------ الحفظ
        function genGroupId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'grp-' + Date.now() + '-' + Math.random().toString(16).slice(2);
        }

        $('item-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const t = currentTarget();
            const rec = form.rec;
            const editing = form.mode === 'edit';
            if ((rec === 'weekly' || (rec === 'daily' && editing)) && !t.days.length) { ErrorHandler.showError('اختار يوم واحد على الأقل'); return; }
            if ((rec === 'none' || rec === 'monthly') && !t.date) { ErrorHandler.showError('اختار التاريخ'); return; }
            const btn = $('btn-save');
            btn.disabled = true;
            btn.textContent = 'جاري الحفظ...';
            try {
                if (form.type === 'event') await saveEvent(t, editing);
                else await saveLesson(t, editing);
                $('item-modal').classList.remove('active');
                await reloadItems();
            } catch (err) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(err));
            } finally {
                btn.disabled = false;
                btn.textContent = 'حفظ';
            }
        });

        async function saveEvent(t, editing) {
            if (!eventsAvailable) throw new Error('المواعيد الشخصية مش متاحة دلوقتي. جرّب تاني بعد شوية.');
            const title = $('f-title').value.trim();
            if (!title) { $('f-title').focus(); throw new Error('اكتب اسم الموعد'); }
            const payload = {
                action: editing ? 'update' : 'create',
                id: editing ? form.editItem.id : null,
                title,
                note: $('f-note').value.trim(),
                color: form.color,
                recurrence_type: t.recurrence_type,
                start_time: minutesToTime(t.start),
                duration_minutes: t.duration,
                start_date: (t.recurrence_type === 'none' || t.recurrence_type === 'monthly') ? t.date : null,
                days: t.days,
                day_of_week: t.days[0]
            };
            const res = await api.savePersonalEvent(payload);
            const n = res && res.created;
            ErrorHandler.showSuccess(editing ? 'تم تعديل الموعد' : (n > 1 ? `تم حفظ ${n} مواعيد` : 'تم حفظ الموعد'));
            track(editing ? 'personal_event_updated' : 'personal_event_added', { recurrence: t.recurrence_type, days_count: n || 1 });
        }

        async function saveLesson(t, editing) {
            const studentId = $('f-student').value;
            if (!studentId) throw new Error('اختار الطالب');
            const base = {
                student_id: studentId,
                start_time: minutesToTime(t.start),
                duration_minutes: t.duration,
                recurrence_type: t.recurrence_type
            };
            if (editing) {
                const payload = { ...base, recurrence_group_id: t.recurrence_type === 'daily' ? (form.editItem.group || null) : null };
                if (t.recurrence_type === 'none' || t.recurrence_type === 'monthly') {
                    payload.start_date = t.date;
                    payload.day_of_week = parseDate(t.date).getDay();
                } else {
                    payload.start_date = null;
                    payload.day_of_week = t.days[0];
                }
                await api.updateSchedule(form.editItem.id, payload);
                ErrorHandler.showSuccess('تم تعديل الحصة');
                return;
            }
            if (t.recurrence_type === 'none' || t.recurrence_type === 'monthly') {
                await api.createSchedule({ ...base, start_date: t.date, day_of_week: parseDate(t.date).getDay(), recurrence_group_id: null });
                ErrorHandler.showSuccess('تم حفظ الحصة');
                track('schedule_saved', { days_count: 1, recurrence: t.recurrence_type });
                return;
            }
            const groupId = t.recurrence_type === 'daily' ? genGroupId() : null;
            const results = await Promise.allSettled(t.days.map((day) => api.createSchedule({ ...base, day_of_week: day, start_date: null, recurrence_group_id: groupId })));
            const failed = [];
            let ok = 0;
            results.forEach((r, i) => { if (r.status === 'fulfilled') ok++; else failed.push(`${DAY_NAMES[t.days[i]]} (${ErrorHandler.getErrorMessage(r.reason)})`); });
            if (!ok) throw new Error('ماتحفظش أي موعد: ' + failed.join('، '));
            track('schedule_saved', { days_count: ok, recurrence: t.recurrence_type });
            if (failed.length) ErrorHandler.showError(`اتحفظ ${ok} من ${t.days.length}. الأيام اللي فيها تعارض: ${failed.join('، ')}`);
            else ErrorHandler.showSuccess(ok === 1 ? 'تم حفظ الحصة' : `تم حفظ ${ok} مواعيد`);
        }

        async function deleteItem(scope) {
            const it = form.editItem;
            if (!it) return;
            const what = it.kind === 'lesson' ? `حصة ${it.title}` : `"${it.title}"`;
            const msg = scope === 'group' ? `حذف ${what} من كل الأيام؟` : `حذف ${what}${it.recurrence_type === 'weekly' ? ` يوم ${DAY_NAMES[it.day_of_week]}` : ''}؟`;
            if (!confirm(msg)) return;
            try {
                if (it.kind === 'event') {
                    await api.savePersonalEvent({ action: 'delete', id: it.id, scope });
                } else if (scope === 'group') {
                    const members = items.filter((x) => x.kind === 'lesson' && x.group === it.group);
                    for (const m of members) await api.deleteSchedule(m.id);
                } else {
                    await api.deleteSchedule(it.id);
                }
                ErrorHandler.showSuccess('تم الحذف');
                $('item-modal').classList.remove('active');
                await reloadItems();
            } catch (err) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(err));
            }
        }
        $('btn-delete').addEventListener('click', () => deleteItem('one'));
        $('btn-delete-group').addEventListener('click', () => deleteItem('group'));

        async function reloadItems() {
            const [schedulesData, ev] = await Promise.all([
                api.getSchedules(),
                eventsAvailable ? api.getPersonalEvents().catch(() => events) : Promise.resolve(null)
            ]);
            schedules = schedulesData.schedules || [];
            if (ev) events = ev;
            rebuildItems();
            render();
            try { window.dispatchEvent(new CustomEvent('tm:schedules-changed')); } catch (e) { /* تجاهل */ }
        }

        // ------------------------------------------------------------ البداية
        (async () => {
            const authInfo = await Auth.requireAuth();
            if (!authInfo) return;
            await loadData();
            const addStudent = new URLSearchParams(location.search).get('add_student');
            if (addStudent) openItemModal({ type: 'lesson', date: selected });
            if (new URLSearchParams(location.search).get('add') === 'event') openItemModal({ type: 'event', date: selected });
            // تحديث خط "دلوقتي" كل دقيقة
            setInterval(() => { if (!document.querySelector('.modal.active')) render(); }, 60000);
        })();
    </script>
    <script src="js/pwa-install.js?v=17" defer></script>
</body>
</html>
