<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إكمال بيانات المعلم</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #F7F5FA; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2B1B4D; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .error { color: #F44336; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>إكمال الملف الشخصي</h2>
    <div id="error-message" class="error"></div>
    
    <input type="text" id="fullname" placeholder="الاسم الكامل" required>
    <input type="text" id="username" placeholder="اسم المستخدم (بالانجليزية وبدون مسافات)" required>
    <input type="tel" id="phone" placeholder="رقم الهاتف" required>
    
    <button id="save-btn" onclick="saveProfile()">حفظ ومتابعة</button>
</div>

<script>
    // التحقق من وجود جلسة قبل السماح بإكمال البيانات
    const teacherId = localStorage.getItem('teacher_id');
    if (!teacherId) {
        window.location.href = '/index.html'; // العودة لتسجيل الدخول إذا لم يكن هناك ID
    }

    async function saveProfile() {
        const fullname = document.getElementById('fullname').value.trim();
        const username = document.getElementById('username').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const errorDiv = document.getElementById('error-message');

        if (!fullname || !username || !phone) {
            errorDiv.innerText = "الرجاء تعبئة جميع الحقول.";
            errorDiv.style.display = 'block';
            return;
        }

        document.getElementById('save-btn').disabled = true;

        try {
            // إرسال البيانات إلى n8n
            const response = await fetch('https://tasneemahmed-n8n.hf.space/webhook-test/save-teacher-profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    id: teacherId, 
                    name: fullname, 
                    username: username,
                    phone: phone
                })
            });

            if (response.ok) {
                // حفظ اسم المستخدم محلياً لتسريع العرض
                localStorage.setItem('teacher_username', username);
                window.location.href = '/dashboard.html';
            } else {
                throw new Error("فشل الحفظ");
            }
        } catch (err) {
            errorDiv.innerText = "حدث خطأ أثناء حفظ البيانات، قد يكون اسم المستخدم مستخدماً مسبقاً.";
            errorDiv.style.display = 'block';
            document.getElementById('save-btn').disabled = false;
        }
    }
</script>
</body>
</html>
