<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف الطالب - Teachers Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 1.5rem; gap: 1rem; }
        .tab-btn { background: none; border: none; padding: 1rem; font-size: 0.95rem; cursor: pointer; color: var(--text-secondary); font-weight: 600; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 0.9rem; font-size: 0.9rem; }
        .info-label { color: var(--text-secondary); font-weight: 500; }
        .info-value { color: var(--text-primary); font-weight: 600; }
        .focus-card {
            background: linear-gradient(180deg, rgba(75,58,90,0.05), var(--card-bg));
            border: 2px solid var(--primary);
            border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem;
        }
        .focus-card h3 { display:flex; align-items:center; gap:0.5rem; }
        .focus-card .sub { color: var(--text-secondary); font-size: 0.85rem; margin: -0.5rem 0 1.25rem; }
        .lesson-hist-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 0.9rem; }
        .lesson-date { color: var(--primary); font-weight: 700; }
        .lesson-detail { color: var(--text-secondary); font-size: 0.88rem; margin-top: 0.4rem; }
        .note-item { background: var(--bg-secondary); border-right: 4px solid var(--primary); padding: 0.9rem; margin-bottom: 0.8rem; border-radius: 6px; }
        .note-date { color: var(--text-light); font-size: 0.78rem; }
        .note-text { color: var(--text-primary); margin-top: 0.35rem; font-size: 0.9rem; }
        .loading { text-align: center; padding: 2rem; color: var(--primary); }
        .empty-state { text-align: center; padding: 2rem; color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-root"></div>

        <main class="main-content">
            <div id="top-header-root"></div>

            <div class="page-body">
                <div id="loading" class="loading">جاري تحميل بيانات الطالب...</div>
                <div id="content" style="display: none;">
                    <div class="flex" style="margin-bottom: 1.5rem;">
                        <div>
                            <h1 id="student-name" style="margin:0 0 0.2rem;"></h1>
                            <p id="student-subject" style="color: var(--text-secondary); margin: 0;"></p>
                        </div>
                        <div style="display:flex; gap:0.5rem;">
                            <button class="btn" style="background: var(--secondary);" onclick="location.href='schedule.html?add_student=' + getStudentId()"><span id="ic-add-appt" class="icon" style="display:inline-flex; vertical-align:-3px;"></span> إضافة موعد</button>
                            <button class="btn btn-primary" onclick="location.href='lesson.html?student_id=' + getStudentId()"><span id="ic-start-lesson" class="icon" style="display:inline-flex; vertical-align:-3px;"></span> بدء الحصة</button>
                        </div>
                    </div>

                    <div class="tabs">
                        <button class="tab-btn active" onclick="switchTab(event, 'info')">المعلومات</button>
                        <button class="tab-btn" onclick="switchTab(event, 'history')">سجل الحصص</button>
                    </div>

                    <!-- تبويب المعلومات (مدمج فيه نمط التدريس والملاحظات مع التركيز عليهم) -->
                    <div id="info" class="tab-content active">
                        <div class="card">
                            <div class="info-row"><span class="info-label">البريد الإلكتروني</span><span class="info-value" id="student-email">-</span></div>
                            <div class="info-row"><span class="info-label">رقم الهاتف</span><span class="info-value" id="student-phone">-</span></div>
                            <div class="info-row"><span class="info-label">رابط الحصة</span><span class="info-value" id="student-link" style="word-break: break-all;">-</span></div>
                            <div class="info-row"><span class="info-label">الموضوع الحالي</span><span class="info-value" id="student-current-topic">-</span></div>
                            <div class="info-row"><span class="info-label">تاريخ الالتحاق</span><span class="info-value" id="student-joined">-</span></div>
                            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                                <button class="btn btn-primary" onclick="editStudent()">تعديل المعلومات</button>
                                <button class="btn btn-danger" onclick="deleteStudent()">حذف الطالب</button>
                            </div>
                        </div>

                        <!-- الجزء المُركَّز عليه: نمط التدريس -->
                        <div class="focus-card">
                            <h3><span id="ic-focus" class="icon" style="display:inline-flex; vertical-align:-3px;"></span> نمط التدريس</h3>
                            <p class="sub">هذا القسم يساعد المساعد الذكي على فهم أسلوب هذا الطالب بدقة</p>
                            <div id="teaching-profile-display" style="margin-bottom: 1.25rem;">
                                <div class="empty-state">جاري التحميل...</div>
                            </div>
                            <form id="teaching-form">
                                <div class="form-group">
                                    <label>نمط التدريس</label>
                                    <textarea id="teaching-style" placeholder="وصف نمط التدريس المفضل لهذا الطالب..."></textarea>
                                </div>
                                <div class="form-group">
                                    <label>تفضيلات الطالب</label>
                                    <textarea id="student-preferences" placeholder="تفضيلات الطالب في التعلم..."></textarea>
                                </div>
                                <div class="form-group">
                                    <label>السياق للمساعد الذكي</label>
                                    <textarea id="ai-context" placeholder="معلومات سياقية يستخدمها المساعد الذكي..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">حفظ نمط التدريس</button>
                            </form>
                        </div>

                        <!-- الجزء المُركَّز عليه: الملاحظات -->
                        <div class="focus-card">
                            <h3><span id="ic-notes-focus" class="icon" style="display:inline-flex; vertical-align:-3px;"></span> الملاحظات</h3>
                            <p class="sub">سجّلي أي ملاحظة عن تقدّم الطالب هنا لمتابعتها لاحقًا</p>
                            <form id="note-form" style="margin-bottom: 1.25rem;">
                                <div class="form-group">
                                    <textarea id="note-text" placeholder="أضف ملاحظة جديدة..." required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">إضافة الملاحظة</button>
                            </form>
                            <div id="notes-list">
                                <div class="empty-state">لا توجد ملاحظات</div>
                            </div>
                        </div>
                    </div>

                    <!-- تبويب سجل الحصص -->
                    <div id="history" class="tab-content">
                        <div id="lessons-list">
                            <div class="empty-state">لا توجد حصص مسجلة</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="error-toast" style="display:none;"></div>
    <div id="success-toast" style="display:none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module">
        import { Auth } from './js/auth.js';
        import { api } from './js/api.js';
        import { ErrorHandler, Formatters } from './js/utils.js';
        import { renderSidebar, renderTopHeader } from './js/sidebar.js';
        import { icon } from './js/icons.js';

        renderSidebar('students');
        renderTopHeader({ title: 'ملف الطالب', subtitle: 'المعلومات، نمط التدريس، والملاحظات في مكان واحد' });
        document.getElementById('ic-add-appt').innerHTML = icon('calendar', { size: 15 });
        document.getElementById('ic-start-lesson').innerHTML = icon('play', { size: 15 });
        document.getElementById('ic-focus').innerHTML = icon('target', { size: 17 });
        document.getElementById('ic-notes-focus').innerHTML = icon('clipboard', { size: 17 });

        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('id');
        window.getStudentId = () => studentId;
        let student = null;

        (async () => {
            const authInfo = await Auth.requireAuth();
            if (!authInfo) return;

            if (!studentId) {
                document.getElementById('loading').innerText = 'معرف الطالب غير موجود';
                return;
            }
            await loadStudent();
        })();

        async function loadStudent() {
            try {
                student = await api.getStudent(studentId);
                renderStudentInfo();
                await Promise.all([loadTeachingProfile(), loadLessons(), loadNotes()]);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            } catch (error) {
                document.getElementById('loading').innerText = 'خطأ: ' + ErrorHandler.getErrorMessage(error);
            }
        }

        function renderStudentInfo() {
            document.getElementById('student-name').innerText = student.name;
            document.getElementById('student-subject').innerHTML = icon('bookOpen', { size: 14 }) + ' ' + (student.subject || 'بدون مادة');
            document.getElementById('student-email').innerText = student.email || '-';
            document.getElementById('student-phone').innerText = student.phone || '-';
            document.getElementById('student-link').innerHTML = student.lesson_link ? icon('link', { size: 13 }) + ' ' + student.lesson_link : '-';
            document.getElementById('student-current-topic').innerText = student.current_topic || '-';
            document.getElementById('student-joined').innerText = Formatters.formatDate(student.created_at);
        }

        async function loadTeachingProfile() {
            try {
                const profile = await api.getTeachingProfile(studentId);
                const display = document.getElementById('teaching-profile-display');
                if (profile) {
                    display.innerHTML = `
                        <div class="info-row"><span class="info-label">نمط التدريس</span><span class="info-value">${profile.teaching_style || '-'}</span></div>
                        <div class="info-row"><span class="info-label">تفضيلات الطالب</span><span class="info-value">${profile.student_preferences || '-'}</span></div>
                        <div class="info-row"><span class="info-label">السياق للمساعد الذكي</span><span class="info-value">${profile.ai_context || '-'}</span></div>
                    `;
                    document.getElementById('teaching-style').value = profile.teaching_style || '';
                    document.getElementById('student-preferences').value = profile.student_preferences || '';
                    document.getElementById('ai-context').value = profile.ai_context || '';
                } else {
                    display.innerHTML = '<div class="empty-state">لم يتم تحديد نمط التدريس بعد</div>';
                }
            } catch (error) {
                console.error('Error loading teaching profile:', error);
            }
        }

        async function loadLessons() {
            try {
                const data = await api.getLessons(studentId, 1, 20);
                const lessons = data.lessons || [];
                const list = document.getElementById('lessons-list');
                if (lessons.length === 0) {
                    list.innerHTML = '<div class="empty-state">لا توجد حصص مسجلة</div>';
                    return;
                }
                list.innerHTML = lessons.map(lesson => `
                    <div class="lesson-hist-item">
                        <div class="lesson-date">${Formatters.formatDate(lesson.lesson_date)}</div>
                        ${lesson.lesson_content ? `<div class="lesson-detail">${icon('bookOpen', { size: 13 })} محتوى الحصة: ${lesson.lesson_content}</div>` : ''}
                        ${lesson.memorization ? `<div class="lesson-detail">${icon('bookOpen', { size: 13 })} الحفظ: ${lesson.memorization}</div>` : ''}
                        ${lesson.recitation ? `<div class="lesson-detail">${icon('messageCircle', { size: 13 })} الأداء الشفهي: ${lesson.recitation}</div>` : ''}
                        ${lesson.performance ? `<div class="lesson-detail">${icon('star', { size: 13 })} التقييم العام: ${lesson.performance}</div>` : ''}
                        ${lesson.homework ? `<div class="lesson-detail">${icon('clipboardList', { size: 13 })} الواجب: ${lesson.homework}</div>` : ''}
                        ${lesson.next_assignment ? `<div class="lesson-detail">${icon('arrowNext', { size: 13 })} للحصة القادمة: ${lesson.next_assignment}</div>` : ''}
                        ${lesson.notes ? `<div class="lesson-detail">${icon('messageSquare', { size: 13 })} ملاحظات: ${lesson.notes}</div>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading lessons:', error);
            }
        }

        async function loadNotes() {
            try {
                const data = await api.getStudentNotes(studentId, 1, 50);
                const notes = data.notes || [];
                const list = document.getElementById('notes-list');
                if (notes.length === 0) {
                    list.innerHTML = '<div class="empty-state">لا توجد ملاحظات</div>';
                    return;
                }
                list.innerHTML = notes.map(note => `
                    <div class="note-item">
                        <div class="note-date">${Formatters.formatDate(note.created_at)}</div>
                        <div class="note-text">${note.note}</div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        window.switchTab = (event, tabName) => {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        };

        document.getElementById('teaching-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.createOrUpdateTeachingProfile(studentId, {
                    teaching_style: document.getElementById('teaching-style').value,
                    student_preferences: document.getElementById('student-preferences').value,
                    ai_context: document.getElementById('ai-context').value
                });
                ErrorHandler.showSuccess('تم حفظ نمط التدريس');
            } catch (error) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(error));
            }
        });

        document.getElementById('note-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await api.createNote(studentId, document.getElementById('note-text').value);
                document.getElementById('note-text').value = '';
                ErrorHandler.showSuccess('تمت إضافة الملاحظة');
                loadNotes();
            } catch (error) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(error));
            }
        });

        window.editStudent = () => alert('تحديث البيانات الأساسية قيد التطوير حاليًا');
        window.deleteStudent = async () => {
            if (!confirm('هل أنت متأكد من حذف هذا الطالب؟ سيتم حذف كل حصصه وملاحظاته ومواعيده أيضًا.')) return;
            try {
                await api.deleteStudent(studentId);
                ErrorHandler.showSuccess('تم حذف الطالب');
                setTimeout(() => window.location.href = 'students.html', 800);
            } catch (error) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(error));
            }
        };
    </script>
</body>
</html>
