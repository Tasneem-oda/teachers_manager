<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملف الطالب - Teacher Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- افتراض تحميل خط IBM Plex Sans Arabic في style.css -->
</head>
<body class="bg-muted">

    <div class="container student-page-container">
        <!-- قسم التحميل الأولي -->
        <div id="page-loader" class="loader-container">
            <p>جاري تحميل بيانات الطالب...</p>
        </div>

        <!-- المحتوى (مخفي حتى انتهاء التحميل) -->
        <main id="student-content" class="hidden">
            
            <!-- الهيدر (القاعدة 45) -->
            <header class="page-header flex-between">
                <div>
                    <h1 id="ui-student-name" class="text-primary">اسم الطالب</h1>
                    <a id="ui-lesson-link" href="#" target="_blank" class="text-secondary hidden">🔗 رابط الحصة</a>
                </div>
                <div class="header-actions">
                    <button id="btn-edit-student" class="btn btn-secondary">تعديل</button>
                    <button id="btn-start-lesson" class="btn btn-primary">ابدأ الحصة</button>
                </div>
            </header>

            <div class="grid-layout">
                <!-- العمود الأيمن: التقدم والملاحظات -->
                <div class="main-column">
                    
                    <!-- بطاقة التقدم الحالي -->
                    <section class="card mb-4">
                        <h2 class="card-title">التقدم الحالي</h2>
                        <div class="progress-details">
                            <p><strong>السورة:</strong> <span id="ui-current-surah">غير محدد</span></p>
                            <p><strong>من آية:</strong> <span id="ui-from-ayah">-</span></p>
                            <p><strong>إلى آية:</strong> <span id="ui-to-ayah">-</span></p>
                        </div>
                    </section>

                    <!-- بطاقة الملاحظات -->
                    <section class="card mb-4">
                        <h2 class="card-title">الملاحظات</h2>
                        <div id="latest-note-container" class="note-box bg-muted p-3 mb-3 border-radius">
                            <!-- القاعدة 52: حالة فارغة -->
                            <p id="ui-latest-note" class="text-secondary">لا توجد ملاحظات مسجلة بعد.</p>
                        </div>
                        
                        <form id="add-note-form" class="mt-3">
                            <textarea id="note-input" class="form-control" rows="3" placeholder="اكتب ملاحظة جديدة للطالب..." required></textarea>
                            <button type="submit" id="btn-save-note" class="btn btn-primary mt-2">حفظ الملاحظة</button>
                        </form>
                    </section>
                </div>

                <!-- العمود الأيسر: الملف التعليمي والتاريخ -->
                <div class="side-column">
                    <!-- الملف التعليمي (Teaching Profile) -->
                    <section class="card mb-4">
                        <h2 class="card-title">الملف التعليمي</h2>
                        <div class="profile-details">
                            <p class="text-sm"><strong>أسلوب الشرح:</strong> <span id="ui-teaching-style">غير محدد</span></p>
                            <p class="text-sm"><strong>تفضيلات الطالب:</strong> <span id="ui-student-prefs">غير محدد</span></p>
                        </div>
                    </section>

                    <!-- سجل الحصص السابقة -->
                    <section class="card">
                        <h2 class="card-title">سجل الحصص</h2>
                        <ul id="lesson-history-list" class="list-unstyled">
                            <!-- يتم حقن الحصص هنا -->
                        </ul>
                        <p id="ui-no-lessons" class="text-secondary text-sm hidden">مفيش حصص سابقة 🌷</p>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- الاعتماديات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/student.js"></script>
</body>
</html>
