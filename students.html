<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطلاب - Teachers Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .student-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; cursor: pointer; transition: 0.2s; }
        .student-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); transform: translateY(-2px); }
        .student-name { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.4rem; }
        .student-info { color: var(--text-secondary); font-size: 0.86rem; margin-bottom: 0.2rem; }
        .student-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .student-actions .btn { flex: 1; padding: 0.5rem; font-size: 0.82rem; margin: 0; }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-secondary); grid-column: 1 / -1; }
        .loader { text-align: center; padding: 3rem; color: var(--primary); }
        .modal { display: none; position: fixed; z-index: 1000; inset: 0; background: rgba(0,0,0,0.5); }
        .modal.active { display: flex; justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 2rem; border-radius: 14px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .close-modal { float: left; font-size: 1.5rem; font-weight: bold; cursor: pointer; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; font-size: 0.88rem; }
        .filters-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filters-row select { max-width: 220px; margin: 0; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-root"></div>

        <main class="main-content">
            <div id="top-header-root"></div>

            <div class="page-body">
                <div class="flex" style="margin-bottom: 1.5rem;">
                    <h1 style="margin:0;">قائمة الطلاب</h1>
                    <button class="btn" id="btn-add-new">+ طالب جديد</button>
                </div>

                <div class="filters-row">
                    <select id="filter-subject">
                        <option value="">جميع المواد</option>
                        <option value="quran">القرآن الكريم</option>
                        <option value="english">اللغة الإنجليزية</option>
                        <option value="arabic">اللغة العربية</option>
                        <option value="math">الرياضيات</option>
                        <option value="science">العلوم</option>
                    </select>
                </div>

                <div class="loader" id="loader">جاري تحميل الطلاب...</div>
                <div class="students-grid" id="students-container"></div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="add-student-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">إضافة طالب جديد</h2>
            <form id="add-student-form">
                <div class="form-group">
                    <label>اسم الطالب *</label>
                    <input type="text" id="student-name" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="student-email">
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="student-phone">
                </div>
                <div class="form-group">
                    <label>المادة *</label>
                    <select id="student-subject" required>
                        <option value="">اختر...</option>
                        <option value="quran">القرآن الكريم</option>
                        <option value="english">اللغة الإنجليزية</option>
                        <option value="arabic">اللغة العربية</option>
                        <option value="math">الرياضيات</option>
                        <option value="science">العلوم</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>رابط الحصة</label>
                    <input type="url" id="student-link" placeholder="https://zoom.us/...">
                </div>
                <div class="form-group">
                    <label>الموضوع الحالي</label>
                    <input type="text" id="student-topic">
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn">حفظ</button>
                    <button type="button" class="btn close-modal" style="background: var(--bg-muted); color: var(--text-primary);">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <div id="error-toast" style="display:none;"></div>
    <div id="success-toast" style="display:none;"></div>

    <script type="module">
        import { Auth } from './js/auth.js';
        import { api } from './js/api.js';
        import { ErrorHandler } from './js/utils.js';
        import { renderSidebar, renderTopHeader } from './js/sidebar.js';

        renderSidebar('students');
        renderTopHeader({ title: 'الطلاب', subtitle: 'إدارة كل طلابك من مكان واحد' });

        const loader = document.getElementById('loader');
        const container = document.getElementById('students-container');
        const modal = document.getElementById('add-student-modal');
        let allStudents = [];

        (async () => {
            const authInfo = await Auth.requireAuth();
            if (!authInfo) return;

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('action') === 'add') {
                modal.classList.add('active');
            }

            await loadStudents();

            const searchTerm = urlParams.get('search');
            if (searchTerm) {
                document.getElementById('top-header-root').addEventListener('input', () => {}); // no-op, search box lives in header
                const filtered = allStudents.filter(s => s.name.toLowerCase().includes(searchTerm.toLowerCase()));
                renderStudents(filtered);
            }
        })();

        async function loadStudents() {
            try {
                const data = await api.getStudents(1, 100);
                allStudents = data.students || [];
                renderStudents(allStudents);
                loader.style.display = 'none';
            } catch (error) {
                loader.innerText = 'خطأ: ' + ErrorHandler.getErrorMessage(error);
            }
        }

        function renderStudents(students) {
            if (students.length === 0) {
                container.innerHTML = '<div class="empty-state">لا توجد طلاب حالياً. <a href="#" onclick="document.getElementById(\'add-student-modal\').classList.add(\'active\')">أضف طالبك الأول</a></div>';
                return;
            }
            container.innerHTML = students.map(student => `
                <div class="student-card">
                    <div class="student-name">${student.name}</div>
                    <div class="student-info">📚 ${student.subject || 'بدون مادة'}</div>
                    <div class="student-info">🎯 ${student.current_topic || 'بدون موضوع'}</div>
                    <div class="student-info">📞 ${student.phone || 'بدون رقم'}</div>
                    <div class="student-actions">
                        <a href="student.html?id=${student.id}" class="btn">عرض الملف</a>
                        <button class="btn" style="background: var(--secondary);" onclick="location.href='schedule.html?add_student=${student.id}'">📅 موعد</button>
                        <button class="btn btn-danger" onclick="deleteStudent('${student.id}')">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('filter-subject').addEventListener('change', (e) => {
            const subject = e.target.value;
            const filtered = allStudents.filter(s => !subject || s.subject === subject);
            renderStudents(filtered);
        });

        document.getElementById('btn-add-new').addEventListener('click', () => {
            document.getElementById('modal-title').textContent = 'إضافة طالب جديد';
            document.getElementById('add-student-form').reset();
            modal.classList.add('active');
        });

        document.querySelectorAll('.close-modal').forEach(btn => {
            btn.addEventListener('click', () => modal.classList.remove('active'));
        });

        document.getElementById('add-student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const studentData = {
                name: document.getElementById('student-name').value,
                email: document.getElementById('student-email').value || null,
                phone: document.getElementById('student-phone').value || null,
                subject: document.getElementById('student-subject').value,
                lesson_link: document.getElementById('student-link').value || null,
                current_topic: document.getElementById('student-topic').value || null
            };
            try {
                await api.createStudent(studentData);
                ErrorHandler.showSuccess('تم إضافة الطالب بنجاح');
                modal.classList.remove('active');
                loadStudents();
            } catch (error) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(error));
            }
        });

        window.deleteStudent = async (id) => {
            if (confirm('هل أنت متأكد من حذف هذا الطالب؟')) {
                try {
                    await api.deleteStudent(id);
                    ErrorHandler.showSuccess('تم حذف الطالب');
                    loadStudents();
                } catch (error) {
                    ErrorHandler.showError(ErrorHandler.getErrorMessage(error));
                }
            }
        };
    </script>
</body>
</html>
