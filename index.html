<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المعلمة - تسجيل الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #F7F5FA; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2B1B4D; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1a1030; }
        .error { color: #F44336; font-size: 14px; margin-bottom: 10px; display: none; }
        .toggle-mode { text-align: center; margin-top: 15px; cursor: pointer; color: #2B1B4D; text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2 id="form-title">تسجيل الدخول</h2>
    <div id="error-message" class="error"></div>
    
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة المرور (6 أحرف على الأقل)" required>
    
    <button id="submit-btn" onclick="handleAuth()">دخول</button>
    <div class="toggle-mode" onclick="toggleMode()" id="toggle-text">ليس لديك حساب؟ إنشاء حساب جديد</div>
</div>

<script>
    const supabaseUrl = 'https://qdpnupgqvjxlrmwwgmij.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkcG51cGdxdmp4bHJtd3dnbWlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NjczMjUsImV4cCI6MjA4NTU0MzMyNX0.gaWPEgrhIQJzZLVoo7x1hnS-63ZJPZN96Xb3WpqApik';
    
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    let isLoginMode = true;

    function toggleMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('form-title').innerText = isLoginMode ? 'تسجيل الدخول' : 'حساب معلم جديد';
        document.getElementById('submit-btn').innerText = isLoginMode ? 'دخول' : 'تسجيل';
        document.getElementById('toggle-text').innerText = isLoginMode ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ تسجيل الدخول';
        document.getElementById('error-message').style.display = 'none';
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-message');
        errorDiv.innerText = msg;
        errorDiv.style.display = 'block';
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || password.length < 6) {
            showError("الرجاء إدخال بريد صحيح وكلمة مرور لا تقل عن 6 أحرف.");
            return;
        }

        document.getElementById('submit-btn').disabled = true;

        let authError = null;
        let userData = null;

        if (isLoginMode) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            authError = error;
            userData = data;
        } else {
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            authError = error;
            userData = data;
        }

        if (authError) {
            showError(authError.message);
            document.getElementById('submit-btn').disabled = false;
        } else {
            localStorage.setItem('teacher_session', userData.session.access_token);
            localStorage.setItem('teacher_id', userData.user.id);
            checkProfileCompletion(userData.user.id);
        }
    }

    async function checkProfileCompletion(userId) {
        try {
            const response = await fetch('https://tasneemahmed-n8n.hf.space/webhook-test/check-teacher', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ teacher_id: userId })
            });
            const result = await response.json();
            
            if (result.profile_exists) {
                window.location.href = '/dashboard.html'; 
            } else {
                window.location.href = '/complete-profile.html'; 
            }
        } catch (err) {
            showError("حدث خطأ أثناء الاتصال بالخادم.");
            document.getElementById('submit-btn').disabled = false;
        }
    }
</script>
</body>
</html>
