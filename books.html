<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتابي - Teachers Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- PWA: أيقونات التطبيق والبيانات الوصفية اللازمة للتثبيت على الشاشة الرئيسية والدومين -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NXC2WZMT"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="app-shell">
        <div id="sidebar-root"></div>
        <main class="main-content">
            <div id="top-header-root"></div>
            <div class="page-body">
                <div class="card" style="text-align:center; padding: 4rem 2rem;">
                    <div id="ic-books-big" style="display:flex; align-items:center; justify-content:center; margin-bottom: 1rem; color: var(--primary);"></div>
                    <h2>كتابي قريبًا</h2>
                    <p style="color: var(--text-secondary); max-width: 420px; margin: 0.5rem auto 0;">
                        هنا هتقدر ترفع كتبك الخاصة (أكتر من كتاب) وتعرضها أثناء التدريس. الميزة دي جزء من المرحلة القادمة.
                    </p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module">
        import { Auth } from './js/auth.js';
        import { renderSidebar, renderTopHeader } from './js/sidebar.js';
        import { icon } from './js/icons.js';

        renderSidebar('books');
        renderTopHeader({ title: 'كتابي', subtitle: 'مكتبتك الخاصة من الكتب', showSearch: false });
        document.getElementById('ic-books-big').innerHTML = icon('bookOpen', { size: 46, strokeWidth: 1.5 });

        (async () => {
            const authInfo = await Auth.requireAuth();
            if (!authInfo) return;
        })();
    </script>
    <script src="js/pwa-install.js" defer></script>
