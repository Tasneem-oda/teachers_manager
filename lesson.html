    <div class="app-shell">
        <div id="sidebar-root"></div>
        <main class="main-content">
            <div id="top-header-root"></div>
            <div class="page-body">
                <div class="container" style="max-width: 1100px; margin: 0; padding: 0;">
                    <div class="ls-loader" id="loader">جاري تحميل بيانات الحصة...</div>

                    <div id="lesson-app" style="display: none;">
                        <!-- ===================== قبل البدء ===================== -->
                        <section class="ls-state" id="state-ready">
                            <div class="ls-hero">
                                <h1 id="r-name"></h1>
                                <div class="ls-hero-sub" id="r-sub"></div>
                            </div>
                            <div class="ls-start">
                                <button type="button" class="btn btn-start-big" id="btn-start"></button>
                                <div class="muted" id="r-start-hint" style="font-size: 0.82rem;"></div>
                                <div class="ls-start-links">
                                    <a id="r-link" target="_blank" rel="noopener" hidden>فتح رابط الحصة فقط</a>
                                    <button type="button" id="btn-absent-ready">الطالب غاب؟</button>
                                    <button type="button" id="btn-manual">تسجيل حصة تمت بدون مؤقت</button>
                                    <button type="button" id="btn-ai-ready">المساعد الذكي</button>
                                </div>
                            </div>
                            <div class="lb-host" id="r-books"></div>
                            <div class="sp-grid2">
                                <div class="x-card" id="r-last"></div>
                                <div id="r-bill"></div>
                            </div>
                        </section>

                        <!-- ===================== أثناء الحصة ===================== -->
                        <section class="ls-state" id="state-live">
                            <div class="ls-bar" id="ls-bar">
                                <div class="ls-bar-status">
                                    <span class="ls-dot" aria-hidden="true"></span>
                                    <div class="ls-bar-text">
                                        <div class="ls-bar-name" id="bar-name"></div>
                                        <div class="ls-bar-time">
                                            <span class="ls-timer" id="bar-timer" aria-live="off">00:00</span>
                                            <span class="ls-left" id="bar-left" hidden></span>
                                        </div>
                                    </div>
                                </div>
                                <a class="sp-icon-btn" id="bar-link" target="_blank" rel="noopener" title="فتح رابط الحصة" aria-label="فتح رابط الحصة" hidden></a>
                                <button type="button" class="sp-icon-btn ls-pip-btn" id="btn-pip" title="نافذة صغيرة فوق Zoom / Meet" aria-label="نافذة صغيرة فوق الشاشة" hidden></button>
                                <button type="button" class="sp-icon-btn" id="btn-open-ai-chat" title="المساعد الذكي" aria-label="المساعد الذكي"><span id="ic-ai-chat-btn" class="icon" style="display:inline-flex;"></span></button>
                                <button type="button" class="btn btn-finish" id="btn-finish"></button>
                                <div class="ls-progress" id="bar-progress" hidden><span></span></div>
                            </div>

                            <!-- معلومات المدرس محتاجها وهو في الحصة: رقم الحصة، الشهر، الوقت، الدفع، التواصل -->
                            <div class="ls-info" id="ls-info" aria-label="معلومات الحصة"></div>
                            <div id="ls-bill-alert"></div>
                            <!-- كتب الحصة: الكتب الخاصة بالطالب + آخر صفحة وصلها، تتفتح فوق الحصة من غير ما تسيبها -->
                            <div class="lb-host" id="ls-books"></div>

                            <div class="ls-seg" id="ls-seg" role="tablist">
                                <button type="button" data-view="now" class="active">الحصة الآن</button>
                                <button type="button" data-view="history">الحصص السابقة <span id="seg-count"></span></button>
                            </div>

                            <div class="ls-grid" id="ls-grid" data-view="now">
                                <form class="ls-form" id="lesson-form" novalidate>
                                    <div class="ls-block" id="blk-date" hidden>
                                        <label class="ls-label" for="f-date">تاريخ الحصة</label>
                                        <input type="date" id="f-date">
                                    </div>

                                    <div class="ls-block ls-prev" id="blk-prev" hidden>
                                        <span class="ls-label">من الحصة اللي فاتت <small class="ls-prev-when" id="prev-when"></small></span>
                                        <div class="ls-plan" id="prev-plan" hidden>
                                            <span class="ls-plan-label">📌 المخطط للحصة دي</span>
                                            <p id="prev-plan-text"></p>
                                        </div>
                                        <div class="ls-prev-hw-wrap" id="blk-prev-hw" hidden>
                                            <span class="ls-plan-label">📚 الواجب: <span class="ls-prev-hw" id="prev-hw-text"></span></span>
                                            <span class="ls-sublabel">عمله؟</span>
                                            <div class="chip-group" data-field="homework_status"></div>
                                        </div>
                                    </div>

                                    <div class="ls-block">
                                        <label class="ls-label" for="f-content">ماذا تم في الحصة؟</label>
                                        <textarea id="f-content" class="ls-main" data-field="lesson_content" placeholder="اكتب باختصار ما تم شرحه أو مراجعته..."></textarea>
                                        <button type="button" class="ls-suggest" id="sug-content" hidden></button>
                                    </div>

                                    <div class="ls-block">
                                        <span class="ls-label">تقييم الطالب</span>
                                        <div class="ls-rating-row"><span class="ls-rating-name" id="lbl-memorization"></span><div class="chip-group" data-field="memorization"></div></div>
                                        <div class="ls-rating-row"><span class="ls-rating-name" id="lbl-recitation"></span><div class="chip-group" data-field="recitation"></div></div>
                                        <div class="ls-rating-row"><span class="ls-rating-name" id="lbl-revision"></span><div class="chip-group" data-field="revision"></div></div>
                                        <button type="button" class="lh-same" id="btn-same-rating" hidden>↺ نفس تقييم الحصة اللي فاتت</button>
                                    </div>

                                    <div class="ls-block ls-two">
                                        <div>
                                            <label class="ls-label" for="f-homework">الواجب الجديد</label>
                                            <textarea id="f-homework" data-field="homework" placeholder="المطلوب من الطالب قبل الحصة الجاية"></textarea>
                                        </div>
                                        <div>
                                            <label class="ls-label" for="f-next">المخطط للحصة الجاية</label>
                                            <textarea id="f-next" data-field="next_assignment" placeholder="هيظهر لك أول الحصة الجاية"></textarea>
                                            <label class="ls-check"><input type="checkbox" id="f-set-topic"> اجعله الموضوع الحالي للطالب</label>
                                        </div>
                                    </div>

                                    <div class="ls-block">
                                        <details class="ls-more" id="ls-more">
                                            <summary><span id="ic-more" style="display:inline-flex"></span> ملاحظات إضافية</summary>
                                            <div class="ls-sub">
                                                <label class="ls-label" for="f-performance">ملاحظات عن الأداء</label>
                                                <textarea id="f-performance" data-field="performance" placeholder="نقاط القوة والضعف..."></textarea>
                                            </div>
                                            <div>
                                                <label class="ls-label" for="f-notes">ملاحظات عامة</label>
                                                <textarea id="f-notes" data-field="notes" placeholder="أي ملاحظة مهمة عن الطالب أو الحصة..."></textarea>
                                            </div>
                                        </details>
                                    </div>

                                    <div class="ls-footer">
                                        <span class="ls-saved" id="saved-ind"></span>
                                        <span class="ls-footer-actions">
                                            <button type="button" class="ls-absent-link" id="btn-absent-live">الطالب ما حضرش؟ سجّل غياب</button>
                                            <button type="button" class="ls-discard" id="btn-discard"></button>
                                        </span>
                                    </div>
                                </form>

                                <aside class="ls-aside" id="ls-aside" aria-label="الحصص السابقة">
                                    <div class="ls-aside-title"><h3>الحصص السابقة</h3><a id="aside-all" href="#">كل الحصص</a></div>
                                    <div id="aside-list"></div>
                                </aside>
                            </div>
                        </section>

                        <!-- ===================== بعد الإنهاء ===================== -->
                        <section class="ls-state" id="state-done">
                            <div class="x-card ls-done">
                                <div class="ls-done-icon" id="done-icon"></div>
                                <h2 id="done-title">تم حفظ الحصة</h2>
                                <p id="done-sub"></p>
                                <div class="ls-done-next" id="done-next" hidden></div>
<div class="ls-done-bill" id="done-bill"></div>
                                <div class="ls-done-actions">
                                    <a class="btn" id="done-student" href="#">ملف الطالب</a>
                                    <a class="btn btn-ghost" id="done-home" href="dashboard.html">الرئيسية</a>
                                </div>
                            </div>
                        </section>
                    </div>

                    <!-- ============================================================
                         مساعد الذكاء الاصطناعي (شات تفاعلي مع ذاكرة خاصة بالطالب)
                         ============================================================ -->
                    <div id="ai-chat-overlay" style="display:none;">
                <div class="ai-chat-card" role="dialog" aria-label="مساعد الحصة">
                    <div class="ai-chat-header">
                        <div class="ai-chat-header-title">
                            <span id="ic-ai-chat-header" class="icon" style="display:inline-flex;"></span>
                            <div>
                                <h3>مساعد الحصة</h3>
                                <p id="ai-chat-student-name">-</p>
                            </div>
                        </div>
                        <div class="ai-head-actions">
                            <button type="button" id="btn-ai-new" class="ai-head-btn" title="محادثة جديدة" aria-label="محادثة جديدة"><span id="ic-ai-new" class="icon" style="display:inline-flex;"></span></button>
                            <button type="button" id="btn-close-ai-chat" class="ai-chat-close-btn" aria-label="إغلاق">
                                <span id="ic-ai-chat-close" class="icon" style="display:inline-flex;"></span>
                            </button>
                        </div>
                    </div>
                    <div class="ai-context-bar" id="ai-context-bar"></div>
                    <div id="ai-chat-messages" class="ai-chat-messages" aria-live="polite"></div>
                    <div class="ai-chips" id="ai-chips" role="toolbar" aria-label="طلبات سريعة"></div>
                    <div id="ai-chat-quota" class="ai-chat-quota"></div>
                    <form id="ai-chat-form" class="ai-chat-input-row">
                        <button type="button" id="btn-ai-mic" class="ai-mic" title="اتكلم بدل ما تكتب" aria-label="اتكلم بدل ما تكتب" hidden><span id="ic-ai-mic" class="icon" style="display:inline-flex;"></span></button>
                        <textarea id="ai-chat-input" placeholder="اكتب بسرعة… مثلًا: غلط في المد" rows="1" maxlength="600"></textarea>
                        <button type="submit" id="btn-ai-chat-send" class="btn" aria-label="إرسال"><span id="ic-ai-send" class="icon" style="display:inline-flex;"></span></button>
                    </form>
                </div>
            </div>
                </div>
            </div>
        </main>
    </div>

    <style>
        /* ======================= مساعد الحصة ======================= */
        #ai-chat-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(41, 37, 45, 0.45); display: flex; align-items: flex-end; justify-content: center; }
        .ai-chat-card {
            background: var(--card-bg, #FFFFFF); width: 100%; max-width: 640px; height: 82%;
            border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.22);
        }
        /* الكمبيوتر: لوحة جانبية والحصة ظاهرة ومتاحة جنبها */
        @media (min-width: 1024px) {
            #ai-chat-overlay { inset: 0 auto 0 0; width: 420px; background: transparent; align-items: stretch; }
            .ai-chat-card { height: 100%; max-width: none; border-radius: 0; box-shadow: 8px 0 30px rgba(41,37,45,0.16); border-inline-start: 1px solid var(--border); }
            body.ai-docked .main-content { margin-left: 420px; }
        }
        .ai-chat-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.85rem 1rem; background: linear-gradient(135deg, #4B3A5A 0%, #7A6B83 100%); color: #fff; flex-shrink: 0; }
        .ai-chat-header-title { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
        .ai-chat-header-title h3 { margin: 0; font-size: 1rem; color: #fff; }
        .ai-chat-header-title p { margin: 0.1rem 0 0; font-size: 0.78rem; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ai-head-actions { display: flex; gap: 0.4rem; }
        .ai-head-btn, .ai-chat-close-btn { background: rgba(255,255,255,0.16); border: none; color: #fff; border-radius: 9px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
        .ai-head-btn:hover, .ai-chat-close-btn:hover { background: rgba(255,255,255,0.3); }
        .ai-context-bar { display: flex; gap: 0.35rem; flex-wrap: wrap; padding: 0.5rem 1rem; background: #F7F3FA; border-bottom: 1px solid var(--border); font-size: 0.74rem; color: var(--text-secondary); flex-shrink: 0; }
        .ai-context-bar span { background: #fff; border: 1px solid var(--border); border-radius: 999px; padding: 0.15rem 0.55rem; white-space: nowrap; }
        .ai-context-bar .live { color: #B85C5C; border-color: #F0CFCF; font-weight: 700; }
        .ai-chat-messages { flex: 1; overflow-y: auto; padding: 0.9rem 1rem; display: flex; flex-direction: column; gap: 0.6rem; background: var(--bg-secondary, #F5F3F0); overscroll-behavior: contain; }
        .ai-welcome { text-align: center; color: var(--text-secondary); font-size: 0.85rem; padding: 0.6rem 0.4rem; line-height: 1.7; }
        .ai-welcome b { color: var(--text-primary); }
        .ai-chat-bubble { max-width: 88%; padding: 0.6rem 0.85rem; border-radius: 14px; font-size: 0.92rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
        .ai-chat-bubble.role-user { align-self: flex-end; background: var(--primary, #4B3A5A); color: #fff; border-bottom-left-radius: 4px; }
        .ai-chat-bubble.role-assistant { align-self: flex-start; background: #fff; border: 1px solid var(--border, #E7E1E8); color: var(--text-primary, #29252D); border-bottom-right-radius: 4px; white-space: normal; }
        .ai-chat-bubble.role-assistant p { margin: 0 0 0.45em; }
        .ai-chat-bubble.role-assistant p:last-child { margin-bottom: 0; }
        .ai-chat-bubble.role-assistant ul, .ai-chat-bubble.role-assistant ol { margin: 0.15em 0 0.5em; padding-inline-start: 1.3em; }
        .ai-chat-bubble.role-assistant li { margin-bottom: 0.25em; }
        .ai-chat-bubble.role-assistant strong { color: var(--primary, #4B3A5A); font-weight: 700; }
        .ai-chat-bubble.role-error { align-self: center; background: #FBEAEA; color: #B85C5C; border: 1px solid #F0CFCF; font-size: 0.82rem; }
        .ai-chat-bubble.is-streaming > :last-child::after { content: '▍'; margin-inline-start: 2px; color: var(--primary); animation: aiCaret 0.9s steps(1) infinite; }
        @keyframes aiCaret { 50% { opacity: 0; } }
        .ai-typing { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 0.65rem 0.9rem; display: flex; gap: 4px; align-items: center; font-size: 0.78rem; color: var(--text-secondary); }
        .ai-typing i { width: 7px; height: 7px; border-radius: 50%; background: #9A8FA3; animation: aiDot 1.1s infinite ease-in-out; }
        .ai-typing i:nth-child(2) { animation-delay: 0.15s; } .ai-typing i:nth-child(3) { animation-delay: 0.3s; }
        .ai-typing span { margin-inline-start: 0.4rem; }
        @keyframes aiDot { 0%, 80%, 100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
        /* أدوات تحت كل رد: ربط الرد بالحصة + طلبات متابعة سريعة */
        .ai-tools { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: -0.25rem; max-width: 92%; }
        .ai-tools button { border: 1px solid var(--border); background: #fff; color: var(--primary); border-radius: 999px; padding: 0.25rem 0.65rem; font: inherit; font-size: 0.76rem; font-weight: 600; cursor: pointer; }
        .ai-tools button.use { background: #EEE9F3; border-color: #D9CFE3; }
        .ai-tools button:disabled { opacity: 0.5; cursor: default; }
        .ai-chips { display: flex; gap: 0.35rem; overflow-x: auto; padding: 0.55rem 1rem 0.2rem; flex-shrink: 0; scrollbar-width: none; background: var(--card-bg); border-top: 1px solid var(--border); }
        .ai-chips::-webkit-scrollbar { display: none; }
        .ai-chips button { flex-shrink: 0; border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary); border-radius: 999px; padding: 0.4rem 0.8rem; font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .ai-chips button:hover { border-color: var(--primary); color: var(--primary); }
        .ai-chat-quota { padding: 0.15rem 1rem 0; font-size: 0.7rem; color: var(--text-secondary); text-align: center; flex-shrink: 0; background: var(--card-bg); min-height: 0.2rem; }
        .ai-chat-input-row { display: flex; align-items: flex-end; gap: 0.45rem; padding: 0.55rem 0.8rem 0.75rem; flex-shrink: 0; background: var(--card-bg); }
        /* font-size لازم 16px على الأقل عشان سفاري في الآيفون مايعملش zoom لما المدرس يضغط على مربع الكتابة */
        .ai-chat-input-row textarea { display: block; flex: 1; min-width: 0; width: auto; margin: 0; resize: none; min-height: 44px; max-height: 120px; overflow-y: auto; padding: 0.65rem 0.85rem; border: 1px solid var(--border); border-radius: 14px; font: inherit; font-size: 1rem; line-height: 1.4; background: var(--bg-secondary); }
        .ai-chat-input-row .btn { flex-shrink: 0; align-self: flex-end; width: 44px; height: 44px; margin: 0; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .ai-mic { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .ai-mic.rec { background: #B85C5C; color: #fff; border-color: #B85C5C; animation: aiPulse 1.2s infinite; }
        @keyframes aiPulse { 50% { box-shadow: 0 0 0 6px rgba(184,92,92,0.2); } }
        @media (max-width: 1023px) {
            .ai-chat-header { padding-top: 0.85rem; }
            .ai-chat-input-row { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); }
        }
        #ai-chat-overlay.kb-open .ai-chat-card { height: 100%; border-radius: 0; }
        #ai-chat-overlay.kb-open .ai-context-bar, #ai-chat-overlay.kb-open .ai-chips, #ai-chat-overlay.kb-open .ai-chat-quota { display: none; }
        @media (max-width: 480px) {
            .ai-chat-card { height: 88%; }
            .ai-chat-bubble { max-width: 94%; }
        }
    </style>

    <script type="module">
        import { Auth } from './js/auth.js?v=21';
        import { renderSidebar, renderTopHeader } from './js/sidebar.js?v=21';
        import { api } from './js/api.js?v=21';
        import { ErrorHandler, Formatters } from './js/utils.js?v=21';

        renderTopHeader({ title: 'الحصة', subtitle: 'ابدأ الحصة وتابعها وسجّلها في مكان واحد', showSearch: false });

        const $ = (id) => document.getElementById(id);
        const esc = (s) => Formatters.escapeHtml(s == null ? '' : String(s));
        const urlSearchParams = new URLSearchParams(window.location.search);
        const studentIdParam = urlSearchParams.get('student_id');
        const openAiParam = urlSearchParams.get('open_ai');
        const manualParam = urlSearchParams.get('manual') === '1';
        const onboardingParam = urlSearchParams.get('onboarding') === '1';

        $('ic-ai-chat-btn').innerHTML = icon('sparkles', { size: 18 });
        $('ic-ai-chat-header').innerHTML = icon('sparkles', { size: 18 });
        $('ic-ai-chat-close').innerHTML = icon('x', { size: 16 });
        $('ic-ai-new').innerHTML = icon('refresh', { size: 16 });
        $('ic-ai-mic').innerHTML = icon('mic', { size: 19 });
        $('ic-ai-send').innerHTML = icon('send', { size: 18 });
        $('ic-more').innerHTML = icon('plus', { size: 15 });
        $('bar-link').innerHTML = icon('link', { size: 18 });
        $('btn-pip').innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11.5" width="7" height="5.5" rx="1.2" fill="currentColor" stroke="none"/></svg>';
        $('done-icon').innerHTML = icon('checkCircle', { size: 34 });
        $('btn-start').innerHTML = icon('play', { size: 18 }) + ' ابدأ الحصة';

        // ------------------------------------------------------------ الحالة
        let ov = null;          // student-overview
        let student = null;
        let billView = null;
        let mode = null;        // 'live' (حصة جارية بمؤقت) | 'manual' (تسجيل بدون مؤقت)
        let lesson = { id: null, startedAt: null };
        let timerInt = null;
        let draftTimer = null;
        let saving = false;
        const TEXT_FIELDS = { lesson_content: 'f-content', homework: 'f-homework', next_assignment: 'f-next', performance: 'f-performance', notes: 'f-notes' };
        const CHIP_FIELDS = ['memorization', 'recitation', 'revision', 'homework_status'];

        function showState(name) {
            document.querySelectorAll('.ls-state').forEach((s) => s.classList.toggle('active', s.id === `state-${name}`));
            window.scrollTo({ top: 0 });
        }

        // ------------------------------------------------------------ أزرار الاختيار (تقييم / الواجب السابق)
        function buildChips(field, options) {
            const group = document.querySelector(`.chip-group[data-field="${field}"]`);
            group.innerHTML = options.map((o) => `<button type="button" data-value="${o.value}" aria-pressed="false">${esc(o.label)}</button>`).join('');
            group.addEventListener('click', (e) => {
                const b = e.target.closest('button[data-value]');
                if (!b) return;
                const was = b.getAttribute('aria-pressed') === 'true';
                group.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
                if (!was) b.setAttribute('aria-pressed', 'true');
                scheduleDraft();
            });
        }
        function chipValue(field) {
            const b = document.querySelector(`.chip-group[data-field="${field}"] button[aria-pressed="true"]`);
            return b ? b.dataset.value : null;
        }
        function setChip(field, value) {
            document.querySelectorAll(`.chip-group[data-field="${field}"] button`).forEach((b) => b.setAttribute('aria-pressed', b.dataset.value === value ? 'true' : 'false'));
        }
        buildChips('memorization', RATINGS);
        buildChips('recitation', RATINGS);
        buildChips('revision', RATINGS);
        buildChips('homework_status', HOMEWORK_STATUS);

        function getFields() {
            const f = {};
            Object.entries(TEXT_FIELDS).forEach(([k, id]) => { f[k] = $(id).value.trim(); });
            CHIP_FIELDS.forEach((k) => { f[k] = chipValue(k); });
            return f;
        }
        function setFields(f) {
            if (!f) return;
            Object.entries(TEXT_FIELDS).forEach(([k, id]) => { $(id).value = f[k] || ''; });
            CHIP_FIELDS.forEach((k) => setChip(k, f[k] || null));
            if (f.performance || f.notes) $('ls-more').open = true;
            updateSuggest();
        }
        function clearForm() { setFields(Object.fromEntries([...Object.keys(TEXT_FIELDS), ...CHIP_FIELDS].map((k) => [k, null]))); $('f-set-topic').checked = false; }

        // ------------------------------------------------------------ مسودة تلقائية (مابتضيعش لو الصفحة اتقفلت أو اتحدّثت)
        function scheduleDraft() {
            if (!mode) return;
            clearTimeout(draftTimer);
            draftTimer = setTimeout(saveDraftNow, 700);
        }
        function saveDraftNow() {
            if (!mode) return;
            const prev = LessonDraft.load(studentIdParam);
            const keepId = prev && prev.requestId && prev.lessonId === lesson.id && prev.mode === mode ? prev.requestId : undefined;
            const ok = LessonDraft.save(studentIdParam, {
                mode, lessonId: lesson.id, startedAt: lesson.startedAt, requestId: keepId,
                date: $('f-date').value || null, fields: getFields(), setTopic: $('f-set-topic').checked
            });
            $('saved-ind').textContent = ok
                ? `✓ محفوظ على الجهاز تلقائيًا (${new Date().toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit', hour12: true })})`
                : '⚠️ مساحة المتصفح مليانة: المكتوب مش بيتحفظ على الجهاز، احفظ الحصة أول ما تخلص.';
        }
        $('lesson-form').addEventListener('input', scheduleDraft);
        $('lesson-form').addEventListener('change', scheduleDraft);

        // ------------------------------------------------------------ التحميل
        // بنبدأ فورًا (مش مستنيين حدث load اللي بيستنى Google Tag Manager وكل الإضافات على النت الضعيف)
        (async () => {
            const authInfo = await Auth.requireAuth();
            if (!authInfo) return;
            if (!studentIdParam) { window.location.href = 'dashboard.html'; return; }
            try {
                await loadOverview();
                decideInitialState();
                loadLessonBooks();   // مش بنستناها: الحصة تفتح فورًا والكتب تظهر لما توصل
                $('loader').style.display = 'none';
                $('lesson-app').style.display = 'block';
                if (openAiParam === '1') openAiChat();
            } catch (error) {
                // الحصة شغالة والنت وقع: نفتح الحصة من المحفوظ على الجهاز بدل شاشة خطأ
                const draft = LessonDraft.load(studentIdParam);
                if (draft && draft.mode && (draft.mode === 'manual' || draft.lessonId)) {
                    enterOfflineFromDraft(draft);
                    return;
                }
                $('loader').innerHTML = `${esc(ErrorHandler.getErrorMessage(error))} <button type="button" class="btn btn-sm" onclick="location.reload()">حاول تاني</button>`;
                $('loader').style.color = 'var(--danger)';
            }
        })();

        /** فتح الحصة من المسودة لما بيانات الطالب ماتحمّلتش (النت ضعيف). بنحاول نحمّل الباقي في الخلفية */
        function enterOfflineFromDraft(draft) {
            try { window.tmTrack && window.tmTrack('lesson_offline_open', { mode: draft.mode }); } catch (e) { /* تجاهل */ }
            ov = { student: { id: studentIdParam, name: (LiveLesson.get(studentIdParam) || {}).name || '' }, stats: {}, lessons: [], schedules: [], billing: { available: false }, payments: [], legacy: true };
            student = ov.student;
            billView = computeBilling(ov.billing);
            renderCommon();
            if (draft.mode === 'live') {
                lesson = { id: draft.lessonId, startedAt: draft.startedAt || Date.now() };
                enterLive();
            } else {
                enterManual(draft.date);
            }
            setFields(draft.fields);
            $('f-set-topic').checked = !!draft.setTopic;
            $('loader').style.display = 'none';
            $('lesson-app').style.display = 'block';
            ErrorHandler.showError('النت ضعيف: فتحنا الحصة من المحفوظ على الجهاز. اكتب عادي، وهنكمّل تحميل بيانات الطالب لما النت يرجع.', 7000);
            const retry = async () => {
                try { await loadOverview(); prepareForm(); renderLessonBooks(); }
                catch (e) { setTimeout(retry, 15000); }
            };
            setTimeout(retry, 8000);
        }

        async function loadOverview() {
            // 40 حصة بتغطي الشهر الحالي كله (عشان "الحصة رقم كام في الشهر")
            ov = await api.getStudentOverview(studentIdParam, { limit: 40 });
            student = ov.student || {};
            billView = computeBilling(ov.billing);
            renderCommon();
            if (mode) renderLiveInfo();
        }

        function decideInitialState() {
            const draft = LessonDraft.load(studentIdParam);
            const ip = ov.in_progress;
            if (ip && ip.id) {
                const serverNow = Date.parse(ov.server_now) || Date.now();
                const started = Date.parse(ip.started_at);
                lesson = { id: ip.id, startedAt: Number.isFinite(started) ? Date.now() - (serverNow - started) : Date.now() };
                enterLive();
                if (draft && lessonHasContent(draft.fields)) {
                    // نفس الحصة، أو مكتوب قديم ماتحفظش: مانمسحش أي حاجة المدرس كتبها
                    setFields(draft.fields);
                    $('f-set-topic').checked = !!draft.setTopic;
                    if (draft.lessonId !== ip.id) saveDraftNow();
                }
                ErrorHandler.showSuccess('تم استكمال الحصة الجارية');
                return;
            }
            if (draft && draft.mode === 'live' && draft.lessonId && ov.legacy) {
                // الخادم القديم مابيرجعش الحصة الجارية: نكمّل من المسودة المحفوظة
                lesson = { id: draft.lessonId, startedAt: draft.startedAt || Date.now() };
                enterLive();
                setFields(draft.fields);
                $('f-set-topic').checked = !!draft.setTopic;
                return;
            }
            if (draft && draft.mode === 'manual' && lessonHasContent(draft.fields)) {
                enterManual(draft.date);
                setFields(draft.fields);
                $('f-set-topic').checked = !!draft.setTopic;
                ErrorHandler.showSuccess('تم استرجاع المسودة غير المحفوظة');
                return;
            }
            if (draft && draft.mode === 'live' && lessonHasContent(draft.fields)) {
                // الحصة اتقفلت (من جهاز تاني أو اتلغت) والمكتوب لسه ماتحفظش: مانمسحهوش من غير ما المدرس يقرر
                recoverClosedLiveDraft(draft);
                return;
            }
            if (draft) LessonDraft.clear(studentIdParam);   // الحصة اتقفلت من جهاز تاني أو خلصت ومفيش مكتوب
            LiveLesson.clear(studentIdParam);
            notifyLiveLessonChanged();
            if (manualParam) { clearForm(); enterManual(); return; }
            showReady();
        }

        /** المكتوب من حصة اتقفلت بره الجهاز ده ← تسجيل يدوي بنفس التاريخ، والمدرس يختار يحفظ أو يلغي */
        function recoverClosedLiveDraft(draft) {
            try { window.tmTrack && window.tmTrack('lesson_draft_recovered', {}); } catch (e) { /* تجاهل */ }
            const d = draft.startedAt ? localDateISO(new Date(draft.startedAt)) : null;
            LiveLesson.clear(studentIdParam);
            notifyLiveLessonChanged();
            enterManual(d);
            setFields(draft.fields);
            $('f-set-topic').checked = !!draft.setTopic;
            saveDraftNow();
            ErrorHandler.showError('الحصة دي اتقفلت من جهاز تاني أو اتلغت، بس اللي كتبته لسه هنا. اضغط "حفظ الحصة" لو عايز تسجّله، أو "إلغاء" لو اتسجّل خلاص.', 10000);
        }

        // ------------------------------------------------------------ العرض
        function renderCommon() {
            const labels = ratingFieldLabels(student.subject);
            $('lbl-memorization').textContent = labels.memorization;
            $('lbl-recitation').textContent = labels.recitation;
            $('lbl-revision').textContent = labels.revision;
            $('bar-name').textContent = student.name || '';
            $('ai-chat-student-name').textContent = student.name || '';
            $('done-student').href = `student.html?id=${encodeURIComponent(studentIdParam)}`;
            $('aside-all').href = `student.html?id=${encodeURIComponent(studentIdParam)}#lessons`;
            if (student.lesson_link) {
                $('r-link').href = student.lesson_link; $('r-link').hidden = false;
                $('bar-link').href = student.lesson_link; $('bar-link').hidden = false;
            }
            renderAside();
        }

        function lessonsCount() { return ov && ov.stats ? Number(ov.stats.completed) || 0 : 0; }
        // آخر حصة "تمت" (الغياب مش بيتحسب) — منها المخطط والواجب السابق
        function lastLesson() {
            if (!ov) return null;
            if (ov.last_completed) return normalizeLesson(ov.last_completed);
            const l = (ov.lessons || []).find((x) => !isAbsenceRow(x));
            return l ? normalizeLesson(l) : null;
        }

        function showReady() {
            mode = null;
            stopTimer();
            unpublishLive();
            $('r-name').textContent = student.name || 'بدون اسم';
            const sub = [`<span>${icon('bookOpen', { size: 14 })} ${esc(subjectLabel(student.subject))}</span>`];
            if (!ov.legacy || (ov.stats && ov.stats.completed_exact)) sub.push(`<span>${icon('clipboardList', { size: 14 })} الحصة رقم ${lessonsCount() + 1}</span>`);
            const next = formatNextOccurrence(nextOccurrence(ov.schedules));
            if (next) sub.push(`<span>${icon('clock', { size: 14 })} الموعد: ${esc(next)}</span>`);
            const badge = billingBadge(billView);
            if (badge) sub.push(`<span class="ls-badge st-${badge.status}">${esc(badge.text)}</span>`);
            $('r-sub').innerHTML = sub.join('');
            $('r-start-hint').textContent = student.lesson_link ? 'رابط الحصة هيفتح تلقائيًا في تبويب جديد' : '';

            const last = lastLesson();
            $('r-last').innerHTML = last
                ? `<div class="x-card-title"><h3>${icon('clipboard', { size: 17 })} آخر حصة · ${esc(relativeDay(last.lesson_date))}</h3>
                       <a class="x-link" href="student.html?id=${encodeURIComponent(studentIdParam)}#lessons">كل الحصص</a></div>
                   ${lessonDetailsHtml(last, student.subject, icon, { highlightNext: true })}`
                : `<div class="x-card-title"><h3>${icon('clipboard', { size: 17 })} آخر حصة</h3></div><div class="x-empty">دي أول حصة مسجّلة مع الطالب 🎉</div>`;

            renderBilling($('r-bill'), true);
            renderLessonBooks();
            showState('ready');
            showTips([
                { id: 'lesson_start', target: '#btn-start', title: 'ابدأ الحصة', text: 'الزرار ده بيشغّل العداد ويفتح رابط الحصة، وكل اللي هتكتبه بيتحفظ تلقائيًا.' },
                { id: 'lesson_absent', target: '#btn-absent-ready', text: 'الطالب ما حضرش؟ سجّل غيابه من هنا (بعذر أو بدون عذر).' }
            ]);
        }

        function renderBilling(container, compact) {
            if (!billView || !billView.available) { container.innerHTML = ''; return; }
            container.innerHTML = billingCardHtml(billView, { compact });
            bindBillingActions(container, {
                getState: () => ({ student, view: billView }),
                onChange: async () => {
                    try { await loadOverview(); } catch (e) { return; }
                    renderBilling(container, compact);
                    if (mode === null && document.getElementById('state-ready').classList.contains('active')) showReady();
                }
            });
        }

        function renderAside() {
            const lessons = (ov && ov.lessons) || [];
            const total = lessonsCount();
            $('seg-count').textContent = lessons.length ? `(${total || lessons.length})` : '';
            if (!lessons.length) { $('aside-list').innerHTML = '<div class="x-empty">لا توجد حصص سابقة</div>'; return; }
            let doneSeen = 0;
            let openedFirst = false;
            $('aside-list').innerHTML = lessons.slice(0, 15).map((l) => {
                const absent = isAbsenceRow(l);
                const peek = absent ? attendanceInfo(l).label : (l.lesson_content || l.homework || '').split('\n')[0];
                const num = !absent && total ? total - doneSeen : '';
                if (!absent) doneSeen++;
                const open = !absent && !openedFirst;
                if (open) openedFirst = true;
                return `<details class="lh-item${absent ? ' lh-absent' : ''}" ${open ? 'open' : ''}>
                    <summary>${num ? `<span class="lh-num">#${num}</span>` : ''}<span class="lh-date">${esc(relativeDay(l.lesson_date))}</span>
                        <span class="lh-peek">${esc(peek)}</span><span class="lh-caret">${icon('chevronDown', { size: 16 })}</span></summary>
                    <div class="lh-body">${lessonDetailsHtml(l, student.subject, icon, { highlightNext: open })}</div>
                </details>`;
            }).join('');
        }

        function prepareForm() {
            const last = lastLesson();
            // من الحصة اللي فاتت: المخطط للحصة دي + متابعة الواجب (أول حاجة المدرس محتاجها أول ما الحصة تبدأ)
            const plan = last && last.next_assignment ? String(last.next_assignment).trim() : '';
            $('prev-plan-text').textContent = plan;
            $('prev-plan').hidden = !plan;
            if (last && last.homework) {
                $('prev-hw-text').textContent = last.homework;
                $('blk-prev-hw').hidden = false;
            } else {
                $('blk-prev-hw').hidden = true;
            }
            $('prev-when').textContent = last ? `(${relativeDay(last.lesson_date)})` : '';
            $('blk-prev').hidden = !plan && !(last && last.homework);
            updateSuggest();
            // "نفس تقييم الحصة اللي فاتت": ضغطة واحدة بدل 3
            const hasRating = !!(last && (last.memorization || last.recitation || last.revision));
            $('btn-same-rating').hidden = !hasRating;
        }
        $('btn-same-rating').addEventListener('click', () => {
            const last = lastLesson();
            if (!last) return;
            ['memorization', 'recitation', 'revision'].forEach((k) => { if (last[k]) setChip(k, last[k]); });
            $('btn-same-rating').hidden = true;
            scheduleDraft();
        });
        // اقتراح: المخطط من الحصة السابقة (بيختفي لو اتضاف للخانة بالفعل)
        function updateSuggest() {
            const last = lastLesson();
            const sug = $('sug-content');
            const planned = last && last.next_assignment ? last.next_assignment.trim() : '';
            if (planned && !$('f-content').value.includes(planned)) {
                sug.innerHTML = `${icon('arrowNext', { size: 14 })} <span>استخدم المخطط: ${esc(planned)}</span>`;
                sug.hidden = false;
            } else {
                sug.hidden = true;
            }
        }
        $('sug-content').addEventListener('click', () => {
            const last = lastLesson();
            if (!last || !last.next_assignment) return;
            const ta = $('f-content');
            ta.value = ta.value.trim() ? `${ta.value.trim()}\n${last.next_assignment}` : last.next_assignment;
            $('sug-content').hidden = true;
            ta.focus();
            scheduleDraft();
        });

        // ------------------------------------------------------------ معلومات الحصة الجارية
        /** مدة الحصة من الجدول: موعد النهارده الأقرب لوقت البدء، وإلا المدة لو كل مواعيده نفس المدة */
        function plannedMinutes() {
            const list = (ov && ov.schedules) || [];
            if (!list.length) return null;
            const startD = new Date(lesson.startedAt || Date.now());
            const startMin = startD.getHours() * 60 + startD.getMinutes();
            const today = list.filter((sc) => sc && sc.start_time && occursOn(sc, startD));
            if (today.length) {
                today.sort((a, b) => Math.abs(timeToMinutes(a.start_time) - startMin) - Math.abs(timeToMinutes(b.start_time) - startMin));
                return Number(today[0].duration_minutes) || 45;
            }
            const durations = [...new Set(list.map((sc) => Number(sc.duration_minutes) || 45))];
            return durations.length === 1 ? durations[0] : null;
        }

        /** حصص الشهر الحالي من السجل (الحصة الجارية لسه مش فيه) */
        function monthStats() {
            const now = new Date();
            let present = 0;
            let absent = 0;
            ((ov && ov.lessons) || []).forEach((l) => {
                const d = lessonDay(l.lesson_date);
                if (!d || d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth()) return;
                if (isAbsenceRow(l)) { if (l.attendance !== 'teacher_cancelled') absent++; }
                else if (!l.status || l.status === 'completed') present++;
            });
            let month = '';
            try { month = now.toLocaleDateString('ar-EG', { month: 'long' }); } catch (e) { /* تجاهل */ }
            return { present, absent, month };
        }

        /** الحساب "بعد الحصة دي" — عشان رسالة التذكير والدفعة يتحسبوا صح وهو لسه في الحصة */
        function projectedBilling() {
            if (!ov || !ov.billing || !billView || !billView.enabled) return billView;
            return computeBilling({ ...ov.billing, taken: (Number(ov.billing.taken) || 0) + 1 });
        }

        function renderLiveInfo() {
            if (!mode || !ov) return;
            const chips = [];
            const exact = !ov.legacy || (ov.stats && ov.stats.completed_exact);
            if (exact) chips.push(`<span class="ls-chip">${icon('clipboardList', { size: 14 })} الحصة رقم ${lessonsCount() + 1}</span>`);
            if (mode === 'live') {
                const ms = monthStats();
                chips.push(`<span class="ls-chip" title="عدد حصص الشهر ده لحد الحصة دي">${icon('calendar', { size: 14 })} ${esc(ms.month || 'الشهر ده')}: دي الحصة ${ms.present + 1}${ms.absent ? ` · غاب ${ms.absent === 1 ? 'مرة' : ms.absent === 2 ? 'مرتين' : ms.absent + ' مرات'}` : ''}</span>`);
                const pm = lesson.plannedMin;
                if (pm && lesson.startedAt) {
                    const s0 = new Date(lesson.startedAt);
                    const endMin = s0.getHours() * 60 + s0.getMinutes() + pm;
                    chips.push(`<span class="ls-chip">${icon('clock', { size: 14 })} ${pm} د · تخلص ${esc(formatClock12(endMin))}</span>`);
                }
            }
            const topic = student.current_surah || student.current_topic;
            if (topic) chips.push(`<span class="ls-chip ls-chip-topic" title="${esc(topic)}">${icon('target', { size: 14 })} ${esc(String(topic).slice(0, 40))}</span>`);

            const info = liveBillingInfo(billView);
            if (info && info.status === 'ok') chips.push(`<span class="ls-chip ls-chip-bill">${icon('creditCard', { size: 14 })} ${esc(info.title)} · ${esc(info.sub)}</span>`);
            else if (billView && billView.available && !billView.enabled) chips.push(`<button type="button" class="ls-chip ls-chip-btn" data-bill-act="setup">${icon('creditCard', { size: 14 })} تابع حصصه وفلوسه</button>`);
            if (student.phone) chips.push(`<a class="ls-chip ls-chip-btn ls-chip-wa" href="${esc(whatsappUrl(student.phone, ''))}" target="_blank" rel="noopener">${icon('messageCircle', { size: 14 })} واتساب</a>`);
            $('ls-info').innerHTML = chips.join('');
            bindBillingActions($('ls-info'), {
                getState: () => ({ student, view: billView }),
                onChange: async () => { try { await loadOverview(); } catch (e) { /* تجاهل */ } }
            });

            // تنبيه الدفع (آخر حصة في الباقة / مستحق): بيظهر واضح ومعاه رسالة تذكير جاهزة محسوبة بعد الحصة دي
            const box = $('ls-bill-alert');
            if (info && info.status !== 'ok') {
                box.innerHTML = `<div class="ls-bill-alert st-${info.status}">
                    <div class="ls-bill-alert-text">${icon('creditCard', { size: 18 })}<div><strong>${esc(info.title)}</strong><span>${esc(info.sub)}</span></div></div>
                    <div class="ls-bill-alert-actions">
                        <button type="button" class="btn btn-sm" data-bill-act="remind">${icon('messageCircle', { size: 14 })} رسالة تذكير</button>
                        <button type="button" class="btn btn-sm btn-ghost" data-bill-act="pay">${icon('plus', { size: 14 })} سجّل دفعة</button>
                    </div>
                </div>`;
                bindBillingActions(box, {
                    getState: () => ({ student, view: projectedBilling() }),
                    onChange: async () => { try { await loadOverview(); } catch (e) { /* تجاهل */ } }
                });
            } else {
                box.innerHTML = '';
            }
        }

        function publishLive() {
            if (mode !== 'live' || !lesson.startedAt) return;
            LiveLesson.publish({
                studentId: studentIdParam, name: student.name || '', lessonId: lesson.id,
                startedAt: lesson.startedAt, plannedMin: lesson.plannedMin || null
            });
            notifyLiveLessonChanged();
        }
        function unpublishLive() {
            LiveLesson.clear(studentIdParam);
            notifyLiveLessonChanged();
            closePip();
        }

        // ------------------------------------------------------------ الحالات
        function enterLive() {
            mode = 'live';
            $('ls-bar').classList.remove('ls-bar-manual');
            $('blk-date').hidden = true;
            $('btn-finish').innerHTML = icon('checkCircle', { size: 17 }) + ' <span class="ls-finish-text">إنهاء<span class="ls-finish-long"> الحصة</span></span>';
            $('btn-discard').textContent = 'بدأت بالغلط؟ احذف الحصة الجارية';
            $('btn-absent-live').hidden = false;
            lesson.plannedMin = plannedMinutes();
            $('btn-pip').hidden = !('documentPictureInPicture' in window);
            prepareForm();
            startTimer();
            renderLiveInfo();
            renderLessonBooks();
            publishLive();
            showState('live');
            dismissTip();
            showTips([
                { id: 'lesson_float', target: '#ls-bar', title: 'اتنقّل براحتك', text: 'تقدر تفتح أي صفحة تانية والحصة شغالة: هتلاقيها في نافذة عائمة صغيرة ترجع منها بضغطة، وكل المكتوب محفوظ.' },
                { id: 'lesson_history_d', target: '#ls-aside', title: 'الحصص اللي فاتت', text: 'سجل الطالب قدامك طول الحصة: آخر حصة مفتوحة، والأقدم بضغطة.' },
                { id: 'lesson_history_m', target: '#ls-seg', title: 'الحصص اللي فاتت', text: 'من تبويب "الحصص السابقة" تشوف سجل الطالب من غير ما تسيب الحصة.' },
                { id: 'lesson_same', target: '#btn-same-rating', text: 'لو مستوى الطالب زي الحصة اللي فاتت، الزرار ده بيملأ التقييم كله بضغطة.' }
            ]);
        }

        function enterManual(date) {
            mode = 'manual';
            stopTimer();
            lesson = { id: null, startedAt: null };
            $('ls-bar').classList.add('ls-bar-manual');
            $('bar-timer').textContent = 'تسجيل بدون مؤقت';
            $('blk-date').hidden = false;
            $('f-date').value = date || localDateISO();
            $('f-date').max = localDateISO();
            $('btn-finish').innerHTML = icon('checkCircle', { size: 17 }) + ' <span class="ls-finish-text">حفظ<span class="ls-finish-long"> الحصة</span></span>';
            $('btn-discard').textContent = 'إلغاء';
            $('btn-absent-live').hidden = true;
            lesson.plannedMin = null;
            $('btn-pip').hidden = true;
            $('bar-left').hidden = true;
            $('bar-progress').hidden = true;
            prepareForm();
            renderLiveInfo();
            renderLessonBooks();
            showState('live');
        }

        function startTimer() {
            stopTimer();
            const tick = () => {
                const t = formatDuration(Date.now() - (lesson.startedAt || Date.now()));
                $('bar-timer').textContent = t;
                document.title = `● ${t} - الحصة`;
                const st = timeState(lesson.startedAt || Date.now(), lesson.plannedMin);
                const left = $('bar-left');
                left.hidden = !st.text;
                left.textContent = st.text ? `${st.text} من ${lesson.plannedMin}` : '';
                left.className = `ls-left ph-${st.phase}`;
                const prog = $('bar-progress');
                prog.hidden = st.progress == null;
                prog.className = `ls-progress ph-${st.phase}`;
                if (st.progress != null) prog.firstElementChild.style.width = `${Math.round(st.progress * 100)}%`;
                $('ls-bar').classList.toggle('is-over', st.phase === 'over');
                timeAlerts(st);
                updatePip(t, st);
            };
            tick();
            timerInt = setInterval(tick, 1000);
        }
        function stopTimer() {
            clearInterval(timerInt);
            timerInt = null;
            document.title = 'الحصة - Teachers Manager';
        }
        function vibrate(pattern) {
            try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(pattern); } catch (e) { /* تجاهل */ }
        }
        // تنبيه مرة واحدة لكل حصة: قبل النهاية بـ 5 دقايق (وقت الواجب والتقييم) ولما الوقت يخلص
        function timeAlerts(st) {
            if (mode !== 'live' || !st.planned) return;
            const key = `tm_lesson_alert_${lesson.id || lesson.startedAt}`;
            let done = '';
            try { done = sessionStorage.getItem(key) || ''; } catch (e) { /* تجاهل */ }
            const mark = (v) => { try { sessionStorage.setItem(key, v); } catch (e) { /* تجاهل */ } };
            if (st.phase === 'over' && !done.includes('over')) {
                mark(done + 'over');
                if (st.left > -60000) { ErrorHandler.showSuccess(`⏰ وقت الحصة خلص (${lesson.plannedMin} د)`, 6000); vibrate([200, 100, 200]); }
            } else if (st.phase === 'soon' && !done.includes('soon')) {
                mark(done + 'soon');
                if (st.left > 4 * 60000) { ErrorHandler.showSuccess('⏳ فاضل 5 دقايق: وقت الواجب والتقييم', 6000); vibrate(150); }
            }
        }

        // ------------------------------------------------------------ بدء الحصة
        $('btn-start').addEventListener('click', async () => {
            const btn = $('btn-start');
            if (btn.disabled) return;
            const other = LiveLesson.list().find((l) => String(l.studentId) !== String(studentIdParam));
            if (other) {
                const mins = Math.max(1, Math.round((Date.now() - other.startedAt) / 60000));
                if (!confirm(`في حصة شغالة مع ${other.name || 'طالب تاني'} من ${mins} دقيقة ولسه ماتقفلتش.\nتبدأ حصة ${student.name || 'الطالب ده'}؟ (الحصة التانية هتفضل مفتوحة في النافذة العائمة)`)) return;
            }
            // الرابط بيتفتح مباشرة مع الضغطة (بعد أي انتظار المتصفح بيمنع النوافذ الجديدة)
            if (student.lesson_link) { try { window.open(student.lesson_link, '_blank', 'noopener'); } catch (e) { /* تجاهل */ } }
            btn.disabled = true;
            btn.innerHTML = icon('clock', { size: 18 }) + ' جاري البدء...';
            try {
                const res = await api.startLesson(studentIdParam);
                const serverNow = Date.parse(res && res.server_now);
                const started = Date.parse(res && res.started_at);
                lesson = {
                    id: (res && (res.lesson_id || res.id)) || null,
                    startedAt: Number.isFinite(serverNow) && Number.isFinite(started) ? Date.now() - (serverNow - started) : Date.now()
                };
                clearForm();
                enterLive();
                saveDraftNow();
                ErrorHandler.showSuccess(res && res.resumed ? 'تم استكمال الحصة الجارية' : 'بدأت الحصة، بالتوفيق!');
                try { window.tmTrack && window.tmTrack('lesson_started', { resumed: !!(res && res.resumed), has_link: !!student.lesson_link, planned_min: lesson.plannedMin || 0 }); } catch (e) { /* تجاهل */ }
            } catch (error) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(error));
            } finally {
                btn.disabled = false;
                btn.innerHTML = icon('play', { size: 18 }) + ' ابدأ الحصة';
            }
        });

        $('btn-manual').addEventListener('click', () => { clearForm(); enterManual(); saveDraftNow(); });
        $('btn-ai-ready').addEventListener('click', () => openAiChat());

        // تسجيل غياب (قبل البدء أو بدل الحصة الجارية)
        function openAbsence(fromLive) {
            openAttendanceModal({
                studentId: studentIdParam,
                studentName: student.name || '',
                lessonId: fromLive ? lesson.id : null,
                onSaved: async (value) => {
                    LessonDraft.clear(studentIdParam);
                    unpublishLive();
                    stopTimer();
                    mode = null;
                    clearForm();
                    try { await loadOverview(); } catch (e) { /* الغياب اتسجل */ }
                    showDone(null, value);
                }
            });
        }
        $('btn-absent-ready').addEventListener('click', () => openAbsence(false));
        $('btn-absent-live').addEventListener('click', () => openAbsence(true));

        // تبويبات الموبايل: الحصة الآن / الحصص السابقة
        $('ls-seg').addEventListener('click', (e) => {
            const b = e.target.closest('button[data-view]');
            if (!b) return;
            $('ls-seg').querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b));
            $('ls-grid').dataset.view = b.dataset.view;
        });

        // ------------------------------------------------------------ حذف الحصة الجارية / إلغاء التسجيل اليدوي
        $('btn-discard').addEventListener('click', async () => {
            if (mode === 'manual') {
                if (lessonHasContent(getFields()) && !confirm('إلغاء تسجيل الحصة؟ المكتوب مش هيتحفظ.')) return;
                LessonDraft.clear(studentIdParam);
                clearForm();
                showReady();
                return;
            }
            if (discarding) return;
            if (!confirm('حذف الحصة الجارية؟ مش هتتسجل ولا هتتحسب في عدد الحصص.')) return;
            discarding = true;
            try {
                if (lesson.id) await api.saveLesson({ action: 'discard', student_id: studentIdParam, lesson_id: lesson.id });
            } catch (error) {
                discarding = false;
                ErrorHandler.showError(error && error.status === 404
                    ? 'الميزة دي مش متاحة دلوقتي. جرّب تاني بعد شوية، ولو المشكلة فضلت كلّمنا على واتساب.'
                    : ErrorHandler.getErrorMessage(error));
                return;
            }
            // الحذف نجح: نرجع لشاشة البداية حتى لو تحديث البيانات بعده فشل
            LessonDraft.clear(studentIdParam);
            clearForm();
            try { await loadOverview(); } catch (e) { /* تجاهل */ }
            showReady();
            discarding = false;
            ErrorHandler.showSuccess('تم حذف الحصة الجارية');
            try { window.tmTrack && window.tmTrack('lesson_discarded', {}); } catch (e) { /* تجاهل */ }
        });

        // ------------------------------------------------------------ إنهاء الحصة
        $('btn-finish').addEventListener('click', async () => {
            if (saving) return;
            const fields = getFields();
            if (!lessonHasContent(fields) && !confirm('لم يُكتب أي شيء عن الحصة. إنهاء الحصة على أي حال؟')) return;
            const payload = {
                action: 'complete',
                student_id: studentIdParam,
                lesson_id: lesson.id,
                ...fields,
                // الحصة اللي بدأت 11:40 بالليل وخلصت بعد 12 تتسجل بيوم بدايتها
                local_date: mode === 'manual' ? ($('f-date').value || localDateISO()) : localDateISO(lesson.startedAt ? new Date(lesson.startedAt) : new Date()),
                // رقم ثابت لكل مسودة: لو الطلب اتأخر واتبعت تاني، الخادم يقدر يعرف إنه نفس الحفظ
                client_request_id: draftRequestId(),
                local_time: mode === 'manual' ? null : localTimeISO(),
                current_topic: $('f-set-topic').checked && fields.next_assignment ? fields.next_assignment.slice(0, 300) : null
            };
            const btn = $('btn-finish');
            saving = true;
            btn.disabled = true;
            const label = btn.innerHTML;
            btn.innerHTML = icon('clock', { size: 17 }) + ' <span class="ls-finish-text">جاري الحفظ...</span>';
            try {
                try {
                    await api.saveLesson(payload);
                } catch (saveErr) {
                    // الطلب اتأخر: ممكن يكون اتحفظ فعلًا على الخادم. نتأكد قبل ما نقول للمدرس يحفظ تاني (عشان مايتسجلش مرتين)
                    const code = saveErr && saveErr.error && saveErr.error.code;
                    if (code !== 'TIMEOUT' || !(await lessonLooksSaved(payload))) throw saveErr;
                }
                try { localStorage.setItem('tm_ob_lesson_done', '1'); } catch (e) { /* تجاهل */ }
                try {
                    // غِنى التسجيل (من غير المحتوى نفسه): بيورّينا المدرسين بيملوا إيه فعلًا وإيه اللي بيتجاهلوه
                    const filled = Object.entries(fields).filter(([, v]) => v && String(v).trim()).map(([k]) => k);
                    (window.dataLayer = window.dataLayer || []).push({
                        event: 'lesson_saved', lesson_mode: mode,
                        minutes: mode === 'live' && lesson.startedAt ? Math.round((Date.now() - lesson.startedAt) / 60000) : 0,
                        fields_filled: filled.length,
                        has_rating: filled.some((k) => ['memorization', 'recitation', 'revision'].includes(k)),
                        has_homework: filled.includes('homework'),
                        has_next: filled.includes('next_assignment'),
                        billing_on: !!(billView && billView.enabled)
                    });
                } catch (e) { /* تجاهل */ }
                const duration = mode === 'live' && lesson.startedAt ? Date.now() - lesson.startedAt : null;
                LessonDraft.clear(studentIdParam);
                unpublishLive();
                stopTimer();
                mode = null;
                // شاشة "تم الحفظ" تظهر فورًا، والملخص (العدد والدفع) يتحدّث لما البيانات توصل
                showDone(duration, null, true);
                loadOverview().then(() => refreshDoneInfo(duration)).catch(() => { /* الحصة اتحفظت، الملخص بس اللي ماتحمّلش */ });
            } catch (error) {
                ErrorHandler.showError(ErrorHandler.getErrorMessage(error) + ' — المكتوب محفوظ على الجهاز، حاول مرة أخرى.');
                btn.innerHTML = label;
            } finally {
                saving = false;
                btn.disabled = false;
            }
        });

        let discarding = false;

        function draftRequestId() {
            const d = LessonDraft.load(studentIdParam) || {};
            if (d.requestId) return d.requestId;
            const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            LessonDraft.save(studentIdParam, { ...d, requestId: id });
            return id;
        }

        /** بعد مهلة الحفظ: هل الحصة دي ظهرت في سجل الطالب؟ */
        async function lessonLooksSaved(payload) {
            try {
                const fresh = await api.getStudentOverview(studentIdParam, { limit: 5 });
                return ((fresh && fresh.lessons) || []).some((l) => !isAbsenceRow(l)
                    && String(l.lesson_date || '').slice(0, 10) === payload.local_date
                    && String(l.lesson_content || '').trim() === String(payload.lesson_content || '').trim()
                    && (!payload.lesson_id || l.id === payload.lesson_id || !l.id));
            } catch (e) { return false; }
        }

        function refreshDoneInfo(duration) {
            if (!$('state-done').classList.contains('active')) return;
            const parts = [];
            if (duration) parts.push(`مدة الحصة ${minutesText(duration)}`);
            if (lessonsCount()) parts.push(`إجمالي حصص ${student.name ? student.name.split(' ')[0] : 'الطالب'}: ${lessonsCount()}`);
            $('done-sub').textContent = parts.join(' · ');
            renderBilling($('done-bill'), false);
            renderDoneNext(null);
        }

        function showDone(duration, absenceValue, pendingRefresh = false) {
            if (absenceValue) {
                const info = attendanceInfo({ status: 'cancelled', attendance: absenceValue });
                $('done-title').textContent = `تم التسجيل: ${info.label}`;
                $('done-icon').innerHTML = `<span style="font-size:1.9rem">${info.icon}</span>`;
            } else {
                $('done-title').textContent = 'تم حفظ الحصة';
                $('done-icon').innerHTML = icon('checkCircle', { size: 34 });
            }
            if (onboardingParam && !absenceValue) {
                $('done-home').className = 'btn';
                $('done-home').textContent = 'كمّل خطوات البداية';
                $('done-student').className = 'btn btn-ghost';
            }
            const parts = [];
            if (duration) parts.push(`مدة الحصة ${minutesText(duration)}`);
            if (!pendingRefresh && lessonsCount()) parts.push(`إجمالي حصص ${student.name ? student.name.split(' ')[0] : 'الطالب'}: ${lessonsCount()}`);
            $('done-sub').textContent = parts.join(' · ');
            if (pendingRefresh) { $('done-bill').innerHTML = ''; $('done-next').hidden = true; }   // بيتحدّثوا بعد ما البيانات الجديدة توصل
            else { renderBilling($('done-bill'), false); renderDoneNext(absenceValue); }
            clearForm();
            showState('done');
            // أول حصة متسجلة = أنسب وقت نقترح فيه تثبيت التطبيق (js/pwa-install.js بيسمع للحدث ده)
            if (!absenceValue) {
                try { window.dispatchEvent(new CustomEvent('tm:value-moment', { detail: { kind: 'lesson_saved' } })); } catch (e) { /* تجاهل */ }
            }
        }

        // الخطوة الجاية بعد الحفظ: نوجّه المدرس لأقوى ميزة لسه ماجربهاش
        function renderDoneNext(absenceValue) {
            const box = $('done-next');
            box.hidden = true;
            box.innerHTML = '';
            if (absenceValue) return;
            const first = student.name ? student.name.split(' ')[0] : 'الطالب';
            const count = lessonsCount();
            let reportKey = '';
            try { reportKey = `tm_report_nudge_${studentIdParam}_${new Date().getFullYear()}_${new Date().getMonth()}`; } catch (e) { /* تجاهل */ }
            let nudged = false;
            try { nudged = !!localStorage.getItem(reportKey); } catch (e) { /* تجاهل */ }
            if (billView && billView.available && !billView.enabled) {
                box.innerHTML = `<strong>💳 عايز البرنامج يحسبلك حصص ${esc(first)} وفلوسه؟</strong>
                    <span>هتعرف كام حصة فاضلة ومين عليه فلوس، وتبعت رسالة تذكير جاهزة من غير إحراج.</span>`;
                box.hidden = false;
                return;   // كارت التفعيل نفسه ظاهر تحت مباشرة
            }
            if (count >= 4 && !nudged) {
                box.innerHTML = `<strong>📘 ${esc(first)} عمل ${esc(lessonsText(count))} لحد دلوقتي</strong>
                    <span>ابعت لولي الأمر تقرير الشهر على واتساب: الحضور والمستوى والواجبات.</span>
                    <a class="btn btn-sm" href="student.html?id=${encodeURIComponent(studentIdParam)}&report=1">ابعت التقرير</a>`;
                box.hidden = false;
                try { localStorage.setItem(reportKey, '1'); } catch (e) { /* تجاهل */ }
            }
        }

        // ============================================================
        // كتب الحصة
        // - الكتب المتاحة للطالب ده (الخاصة بيه الأول، وبعدين العامة)، والأخير اللي اتفتح معاه في الأول
        // - كل كتاب بيفتح على آخر صفحة وصلها الطالب ده (محفوظة على الجهاز لكل طالب)
        // - الكتاب بيفتح فوق الحصة: العداد شغال والمكتوب زي ما هو، وفيه زرار يسجّل الصفحة في الحصة
        // ============================================================
        const BOOK_POS_KEY = `tm_book_pos_${studentIdParam}`;
        const BOOK_HINT_KEY = 'tm_lesson_books_hint_off';
        let lessonBooks = null;      // null = لسه بيتحمّل / [] = مفيش
        let allBooksCount = 0;
        let bookViewer = null;
        const BOOK_TYPE = { pdf: 'PDF', docx: 'Word', pptx: 'PowerPoint', txt: 'نص', image: 'صورة' };

        const bookPos = {
            all() { try { return JSON.parse(localStorage.getItem(BOOK_POS_KEY) || '{}') || {}; } catch (e) { return {}; } },
            get(id) { return this.all()[id] || null; },
            set(id, page) {
                try {
                    const all = this.all();
                    all[id] = { page: Math.max(1, Number(page) || 1), at: Date.now() };
                    localStorage.setItem(BOOK_POS_KEY, JSON.stringify(all));
                } catch (e) { /* تجاهل */ }
            }
        };

        async function loadLessonBooks() {
            try {
                const res = await api.listBooks();
                const books = (res && res.books) || (Array.isArray(res) ? res : []);
                const usable = books.filter((b) => b && b.status === 'ready' && b.storage_path);
                allBooksCount = usable.length;
                const sid = String(studentIdParam);
                const pos = bookPos.all();
                lessonBooks = usable
                    .map((b) => {
                        const ids = (b.student_ids || []).map(String);
                        return { ...b, mine: ids.includes(sid), general: ids.length === 0, last: pos[b.id] || null };
                    })
                    .filter((b) => b.mine || b.general)
                    .sort((a, b) => ((b.last ? b.last.at : 0) - (a.last ? a.last.at : 0))
                        || (b.mine - a.mine)
                        || (Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0)));
            } catch (e) {
                lessonBooks = [];   // المكتبة مش متاحة دلوقتي: الحصة تكمّل عادي
                allBooksCount = -1;
            }
            renderLessonBooks();
        }

        function bookTileHtml(b, i) {
            const unit = b.file_type === 'pptx' ? 'شريحة' : 'صفحة';
            let meta;
            if (b.last && b.last.page > 1) meta = `<span class="lb-resume">كمّل من ${unit} ${b.last.page}</span>`;
            else if (b.mine) meta = `<span class="lb-mine">خاص ب${esc((student.name || 'الطالب').split(' ')[0])}</span>`;
            else meta = `<span>${esc(BOOK_TYPE[b.file_type] || b.file_type || '')}${b.page_count ? ` · ${b.page_count} ${unit}` : ''}</span>`;
            return `<button type="button" class="lb-tile${i === 0 && b.last ? ' is-last' : ''}" data-track="lesson_book_tile" data-book="${esc(b.id)}" title="فتح ${esc(b.title)}">
                <span class="lb-ic">${icon(b.file_type === 'image' ? 'image' : 'bookOpen', { size: 18 })}</span>
                <span class="lb-txt"><span class="lb-title">${esc(b.title)}</span><span class="lb-meta">${meta}</span></span>

        function renderLessonBooks() {
            const host = mode ? $('ls-books') : $('r-books');
            ['ls-books', 'r-books'].forEach((id) => { if ($(id) !== host) $(id).innerHTML = ''; });
            if (!host || lessonBooks === null) return;
            if (!lessonBooks.length) {
                let off = false;
                try { off = localStorage.getItem(BOOK_HINT_KEY) === '1'; } catch (e) { /* تجاهل */ }
                if (off || allBooksCount < 0) { host.innerHTML = ''; return; }
                // تلميحة صغيرة: مفيش كتب للطالب ده لسه
                host.innerHTML = `<div class="lb-hint">
                    <span class="lb-ic">${icon('bookOpen', { size: 17 })}</span>
                    <span>${allBooksCount > 0 ? `مفيش كتاب متاح ل${esc((student.name || 'الطالب').split(' ')[0])}. ` : ''}ارفع كتاب أو مذكرة الطالب من <a href="books.html">مكتبتي</a>، وهيظهر هنا تفتحه بضغطة وقت الحصة على آخر صفحة وصلها.</span>
                    <button type="button" class="lb-hint-x" aria-label="إخفاء" title="إخفاء">${icon('x', { size: 14 })}</button>
                </div>`;
                host.querySelector('.lb-hint-x').addEventListener('click', () => {
                    try { localStorage.setItem(BOOK_HINT_KEY, '1'); } catch (e) { /* تجاهل */ }
                    host.innerHTML = '';
                });
                return;
            }
            const shown = lessonBooks.slice(0, 4);
            host.innerHTML = `<div class="lb-card">
                <div class="lb-head">
                    <span class="lb-head-title">${icon('bookOpen', { size: 16 })} كتب الحصة</span>

                <div class="lb-row">${shown.map(bookTileHtml).join('')}</div>
            </div>`;
        }

        // ضغطة على كتاب (في الحصة أو قبلها أو من قايمة "كل الكتب")
        document.addEventListener('click', (e) => {
            const tile = e.target.closest('[data-book]');
            if (tile && lessonBooks) {
                const b = lessonBooks.find((x) => String(x.id) === tile.dataset.book);
                if (b) { const m = tile.closest('.lb-picker'); if (m) m.remove(); openLessonBook(b, tile); }
                return;
            }
            if (e.target.closest('[data-books-all]')) openBooksPicker();
        });

        function openBooksPicker() {
            if (!lessonBooks || document.querySelector('.lb-picker')) return;
            const modal = document.createElement('div');
            modal.className = 'modal active lb-picker';
            modal.innerHTML = `<div class="modal-content" role="dialog" aria-modal="true" aria-label="كتب الحصة">
                <div class="lb-picker-head"><h2>كتب ${esc((student.name || 'الطالب').split(' ')[0])}</h2>
                    <button type="button" class="lb-picker-x" aria-label="إغلاق">${icon('x', { size: 18 })}</button></div>
                <input type="search" class="lb-search" placeholder="ابحث باسم الكتاب…" aria-label="ابحث باسم الكتاب">
                <div class="lb-list"></div>
                <a class="lb-lib-link" href="books.html">${icon('plus', { size: 14 })} إضافة كتاب من مكتبتي</a>
            </div>`;
            document.body.appendChild(modal);
            const list = modal.querySelector('.lb-list');
            const draw = (q) => {
                const t = String(q || '').trim().toLowerCase();
                const items = lessonBooks.filter((b) => !t || String(b.title).toLowerCase().includes(t));
                list.innerHTML = items.length ? items.map(bookTileHtml).join('') : '<div class="x-empty">مفيش كتاب بالاسم ده</div>';
            };
            draw('');
            const close = () => { modal.remove(); document.removeEventListener('keydown', onKey); };
            const onKey = (e) => { if (e.key === 'Escape') close(); };
            document.addEventListener('keydown', onKey);
            modal.querySelector('.lb-picker-x').addEventListener('click', close);
            modal.addEventListener('mousedown', (e) => { if (e.target === modal) close(); });
            const search = modal.querySelector('.lb-search');
            search.addEventListener('input', () => draw(search.value));
            if (window.matchMedia('(min-width: 900px)').matches) search.focus();
        }

        function openLessonBook(book, opener) {
            if (bookViewer) return;
            const last = bookPos.get(book.id);
            bookViewer = openBookViewer({
                api, book, opener,
                startPage: last ? last.page : 1,
                onPageChange: (p) => bookPos.set(book.id, p),
                onClose: () => {
                    bookViewer = null;
                    // النافذة العائمة ترجع تختفي (إحنا في صفحة الحصة نفسها)
                    try { window.dispatchEvent(new CustomEvent('tm:live-lesson-except', { detail: studentIdParam })); } catch (e) { /* تجاهل */ }
                    // الكتاب اللي اتفتح يطلع الأول بآخر صفحة
                    if (lessonBooks) {
                        const pos = bookPos.all();
                        lessonBooks.forEach((b) => { b.last = pos[b.id] || null; });
                        lessonBooks.sort((a, b) => ((b.last ? b.last.at : 0) - (a.last ? a.last.at : 0)) || (b.mine - a.mine));
                    }
                    renderLessonBooks();
                }
            });
            if (!last) bookPos.set(book.id, 1);
            try { (window.dataLayer = window.dataLayer || []).push({ event: 'lesson_book_opened', lesson_mode: mode || 'ready' }); } catch (e) { /* تجاهل */ }
            // الحصة شغالة: العداد يفضل ظاهر فوق الكتاب في النافذة العائمة، والضغط عليها بيقفل الكتاب ويرجع للحصة
            if (mode === 'live') {
                try { window.dispatchEvent(new CustomEvent('tm:live-lesson-except', { detail: null })); } catch (e) { /* تجاهل */ }
            }
            // زرار "سجّل الصفحة في الحصة": بيكتب اسم الكتاب ورقم الصفحة في "ماذا تم في الحصة"
            if (mode) {
                const tools = bookViewer.root.querySelector('.bv-tools');
                if (tools) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'bv-btn lb-log-btn';
                    btn.title = 'اكتب اسم الكتاب ورقم الصفحة في "ماذا تم في الحصة"';
                    btn.innerHTML = `${icon('plus', { size: 15 })}<span>سجّل الصفحة في الحصة</span>`;
                    btn.addEventListener('click', () => {
                        const v = bookViewer ? bookViewer : null;
                        const page = v && v.pageCount && v.pageCount > 1 ? v.page : null;
                        const unit = book.file_type === 'pptx' ? 'شريحة' : 'ص';
                        const line = `📖 ${book.title}${page ? ` — ${unit} ${page}` : ''}`;
                        const ta = $('f-content');
                        if (!ta.value.includes(line)) {
                            ta.value = ta.value.trim() ? `${ta.value.trim()}\n${line}` : line;
                            ta.dispatchEvent(new Event('input', { bubbles: true }));
                        }
                        ErrorHandler.showSuccess(page ? `اتسجّلت ${unit === 'ص' ? 'صفحة' : 'شريحة'} ${page} في الحصة` : 'اتسجّل الكتاب في الحصة');
                    });
                    tools.insertBefore(btn, tools.firstChild);
                }
            }
        }

        // ضغطة على النافذة العائمة والكتاب مفتوح: نقفل الكتاب ونرجع للحصة من غير تحميل الصفحة
        window.addEventListener('tm:live-lesson-go', (e) => {

        // الموبايل: لما المدرس يروح لـ Zoom/واتساب الصفحة بتستخبى من غير pagehide — نحفظ فورًا.
        // ولما يرجع: نتأكد إن الحصة لسه شغالة (ممكن تكون اتقفلت من جهاز تاني)
        let lastLiveCheck = Date.now();
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'hidden') {
                if (mode) { clearTimeout(draftTimer); saveDraftNow(); }
                return;
            }
            if (mode !== 'live' || !lesson.id || saving || Date.now() - lastLiveCheck < 60000) return;
            lastLiveCheck = Date.now();
            let fresh;
            try { fresh = await api.getStudentOverview(studentIdParam, { limit: 40 }); } catch (e) { return; }
            if (mode !== 'live' || !fresh || fresh.legacy) return;
            const ip = fresh.in_progress;
            if (!ip || !ip.id || ip.id !== lesson.id) {
                ov = fresh;
                student = ov.student || student;
                billView = computeBilling(ov.billing);
                stopTimer();
                const draft = { mode: 'live', lessonId: lesson.id, startedAt: lesson.startedAt, fields: getFields(), setTopic: $('f-set-topic').checked };
                if (lessonHasContent(draft.fields)) recoverClosedLiveDraft(draft);
                else { LessonDraft.clear(studentIdParam); showReady(); ErrorHandler.showError('الحصة دي اتقفلت من جهاز تاني.', 6000); }
            }
        });

        window.addEventListener('pagehide', () => {
            if (!mode) return;
            clearTimeout(draftTimer);
            saveDraftNow();
            if (mode === 'live') publishLive();
        });

        async function openPip() {
