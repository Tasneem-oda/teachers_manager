        // - بيبعت مع كل رسالة "الحصة الجارية الآن" (اللي اتكتب في الفورم + التقييم + الوقت)
        // - المحادثة مربوطة بالجلسة (بداية الحصة أو "محادثة جديدة")، ومحفوظة لو الشات اتقفل
        // - أزرار سريعة حسب وضع الحصة + أدوات تحت كل رد (أقصر/أسهل/تاني/كمّل + إضافة للفورم)

        const aiStore = {
            load() { try { return JSON.parse(sessionStorage.getItem(AI_STORE_KEY) || '[]'); } catch (e) { return []; } },
            save() { try { sessionStorage.setItem(AI_STORE_KEY, JSON.stringify(aiHistory.slice(-30))); } catch (e) { /* تجاهل */ } },
            since() { try { return sessionStorage.getItem(AI_SINCE_KEY); } catch (e) { return null; } },
            setSince(v) { try { sessionStorage.setItem(AI_SINCE_KEY, v); } catch (e) { /* تجاهل */ } }
        };

        /** "الحصة الجارية الآن" — بتتبعت مع كل رسالة */
        function aiLessonContext() {
            const f = getFields();
            const last = lastLesson();
            const ctx = {
                mode: mode || 'ready',
                elapsed_min: mode === 'live' && lesson.startedAt ? Math.round((Date.now() - lesson.startedAt) / 60000) : null,
                prev_homework: last && last.homework ? last.homework : ''
            };

        function aiSessionSince() {
            const marker = aiStore.since();
            const lessonStart = mode === 'live' && lesson.startedAt ? new Date(lesson.startedAt - 15 * 60000).toISOString() : null;
            if (marker && lessonStart) return marker > lessonStart ? marker : lessonStart;
            return marker || lessonStart || null;

        // ---------------- تنسيق آمن للماركداون البسيط (النص بيتعمله escape الأول — حماية XSS)
        function formatAiMarkdown(rawText) {
            const escaped = Formatters.escapeHtml(rawText || '');
            const inlineFormat = (s) => s
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/__(.+?)__/g, '<strong>$1</strong>')
                .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
            const lines = escaped.split('\n');
            let html = '';
            let list = null;
            const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
            lines.forEach((line) => {
                const t = line.trim();
                const ul = t.match(/^[*\-•]\s+(.*)$/);
                const ol = t.match(/^(?:\d+|[٠-٩]+)[.)]\s+(.*)$/);
                if (ul || ol) {
                    const kind = ul ? 'ul' : 'ol';
                    if (list !== kind) { closeList(); html += `<${kind}>`; list = kind; }
                    html += `<li>${inlineFormat((ul || ol)[1])}</li>`;
                } else {
                    closeList();
                    if (t) html += `<p>${inlineFormat(t.replace(/^#{1,4}\s*/, ''))}</p>`;
                }
            });
            closeList();
            return html || '<p></p>';
        }
        /** نص عادي من الماركداون (عشان يتضاف لخانات الحصة) */
        function aiPlain(text) {
            return String(text || '')
                .replace(/\*\*(.+?)\*\*/g, '$1').replace(/__(.+?)__/g, '$1')
                .replace(/^#{1,4}\s*/gm, '').replace(/^[*•]\s+/gm, '- ')
                .replace(/\n{3,}/g, '\n\n').trim();
        }

        function aiScrollBottom(force) {
            const near = aiChatMessages.scrollHeight - aiChatMessages.scrollTop - aiChatMessages.clientHeight < 120;
            if (force || near) aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
        }
        function aiRemoveTransient() {
            aiChatMessages.querySelectorAll('.ai-typing, .ai-welcome').forEach((el) => el.remove());
        }
        function aiWelcome() {
            const live = mode === 'live';
            aiChatMessages.innerHTML = `<div class="ai-welcome">
                ${live ? '<b>المساعد شايف الحصة دي لحظة بلحظة.</b>' : '<b>المساعد عارف سجل الطالب كله.</b>'}<br>
                اكتب بسرعة زي ما بتكلم زميل: «<b>غلط في المد</b>»، «<b>أسهل</b>»، «<b>كمّل</b>»، «<b>زهق</b>»، «<b>اسأله</b>».
            </div>`;
        }

        function renderAiChatMessage(role, text, opts = {}) {
            aiRemoveTransient();
            aiChatMessages.querySelectorAll('.ai-tools').forEach((el) => { if (!opts.keepTools) el.remove(); });
            const bubble = document.createElement('div');
            bubble.className = `ai-chat-bubble role-${role}`;
            if (role === 'assistant') bubble.innerHTML = formatAiMarkdown(text);
            else bubble.textContent = text;
            aiChatMessages.appendChild(bubble);
            aiScrollBottom(true);
            return bubble;
        }
        /** أدوات تحت آخر رد: طلبات متابعة + ربط الرد بالحصة */
        function renderAiTools(text) {
            const tools = document.createElement('div');
            tools.className = 'ai-tools';
            const formOpen = mode === 'live' || mode === 'manual';
            tools.innerHTML = `
                <button type="button" data-f="أقصر">أقصر</button>
                <button type="button" data-f="أسهل">أسهل</button>
                <button type="button" data-f="تاني">مثال تاني</button>
                <button type="button" data-f="كمّل">كمّل</button>
                <button type="button" class="use" data-use="copy">📋 نسخ</button>
                ${formOpen ? `<button type="button" class="use" data-use="homework">➕ للواجب</button>
                <button type="button" class="use" data-use="content">➕ للي اتعمل</button>` : ''}`;
            tools.addEventListener('click', async (e) => {
                const b = e.target.closest('button');
                if (!b || b.disabled) return;
                if (b.dataset.f) { aiSend(b.dataset.f); return; }
                const plain = aiPlain(text);
                if (b.dataset.use === 'copy') {
                    try { await navigator.clipboard.writeText(plain); ErrorHandler.showSuccess('تم النسخ'); }
                    catch (err) { ErrorHandler.showError('مقدرناش ننسخ تلقائيًا'); }
                    return;
                }
                const id = b.dataset.use === 'homework' ? 'f-homework' : 'f-content';
                const el = $(id);
                el.value = el.value.trim() ? `${el.value.trim()}\n${plain}` : plain;
                el.dispatchEvent(new Event('input', { bubbles: true }));   // بيحفظ المسودة تلقائيًا
                b.disabled = true;
                b.textContent = '✓ اتضاف';
                try { (window.dataLayer = window.dataLayer || []).push({ event: 'ai_reply_used', target: b.dataset.use }); } catch (err) { /* تجاهل */ }
            });
            aiChatMessages.appendChild(tools);
            aiScrollBottom(true);
        }
        function showAiTyping(label) {
            aiRemoveTransient();
            const el = document.createElement('div');
            el.className = 'ai-typing';
            el.innerHTML = `<i></i><i></i><i></i><span>${esc(label || 'بيفكر')}</span>`;
            aiChatMessages.appendChild(el);
            aiScrollBottom(true);
        }

        function restoreAiHistory() {
            aiHistory = aiStore.load();
            if (!aiHistory.length) { aiWelcome(); return; }
            aiChatMessages.innerHTML = '';
            aiHistory.forEach((m) => renderAiChatMessage(m.role, m.text, { keepTools: true }));
            const last = aiHistory[aiHistory.length - 1];
            if (last && last.role === 'assistant') renderAiTools(last.text);
        }

        // ---------------- فتح وقفل
        function fitAiChatToViewport() {
            if (window.matchMedia('(min-width: 1024px)').matches) { aiChatOverlay.style.top = ''; aiChatOverlay.style.height = ''; return; }
            const vv = window.visualViewport;
            if (!vv) return;
            aiChatOverlay.style.top = Math.max(0, Math.round(vv.offsetTop)) + 'px';
            aiChatOverlay.style.height = Math.round(vv.height) + 'px';
            aiChatOverlay.style.bottom = 'auto';
            // الكيبورد مفتوح: الشات ياخد الشاشة كلها ونخبّي الشريط والاختصارات عشان الرد يبان
            aiChatOverlay.classList.toggle('kb-open', vv.height < window.innerHeight * 0.75);
        }
        function autoGrowAiChatInput() {
            aiChatInput.style.height = 'auto';
            const content = aiChatInput.scrollHeight;
            if (!content || !aiChatInput.offsetParent) { aiChatInput.style.height = ''; return; }
            const border = aiChatInput.offsetHeight - aiChatInput.clientHeight;
            aiChatInput.style.height = Math.max(44, Math.min(content + border, 120)) + 'px';
        }
        function openAiChat() {
            if (!studentIdParam) return;
            const docked = window.matchMedia('(min-width: 1024px)').matches;
            aiChatOverlay.style.display = 'flex';
            document.body.classList.toggle('ai-docked', docked);
            if (!docked) document.body.style.overflow = 'hidden';
            if (!aiChatMessages.children.length || !aiHistory.length) restoreAiHistory();
            renderAiChips();
            renderAiContextBar();
            fitAiChatToViewport();
            autoGrowAiChatInput();
            aiScrollBottom(true);
            if (docked) aiChatInput.focus({ preventScroll: true });
            try { (window.dataLayer = window.dataLayer || []).push({ event: 'ai_opened', lesson_mode: mode || 'ready' }); } catch (e) { /* تجاهل */ }
        }
        function closeAiChat() {
            aiChatOverlay.style.display = 'none';
            document.body.style.overflow = '';
            document.body.classList.remove('ai-docked');
            stopMic();
        }
        document.getElementById('btn-open-ai-chat').addEventListener('click', () => (aiChatOverlay.style.display === 'none' ? openAiChat() : closeAiChat()));
        document.getElementById('btn-close-ai-chat').addEventListener('click', closeAiChat);
        aiChatInput.addEventListener('input', autoGrowAiChatInput);
        aiChatOverlay.addEventListener('mousedown', (e) => { if (e.target === aiChatOverlay) closeAiChat(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && aiChatOverlay.style.display !== 'none') closeAiChat(); });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => { if (aiChatOverlay.style.display !== 'none') { fitAiChatToViewport(); aiScrollBottom(); } });
            window.visualViewport.addEventListener('scroll', () => { if (aiChatOverlay.style.display !== 'none') fitAiChatToViewport(); });
        }
        // تحديث شريط الحالة (دقايق الحصة) كل دقيقة والشات مفتوح
        setInterval(() => { if (aiChatOverlay.style.display !== 'none') renderAiContextBar(); }, 60000);

        $('btn-ai-new').addEventListener('click', () => {
            if (aiChatBusy) return;
            aiStore.setSince(new Date().toISOString());
            aiHistory = [];
            aiStore.save();
            aiChatQuota.textContent = '';
            aiWelcome();
            ErrorHandler.showSuccess('بدأنا محادثة جديدة');
        });

        aiChatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                e.preventDefault();
                aiChatForm.requestSubmit();
            }
        });

        // ---------------- الإدخال بالصوت (لو المتصفح بيدعمه)
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognizer = null;
        function stopMic() {
            if (recognizer) { try { recognizer.stop(); } catch (e) { /* تجاهل */ } }
        }
        if (SpeechRec) {
            const micBtn = $('btn-ai-mic');
            micBtn.hidden = false;
            micBtn.addEventListener('click', () => {
                if (recognizer) { stopMic(); return; }
                try {
                    recognizer = new SpeechRec();
                    recognizer.lang = 'ar-EG';
                    recognizer.interimResults = true;
                    recognizer.continuous = false;
                    const base = aiChatInput.value.trim();
                    recognizer.onresult = (ev) => {
                        const said = Array.from(ev.results).map((r) => r[0].transcript).join(' ');
                        aiChatInput.value = (base ? base + ' ' : '') + said;
                        autoGrowAiChatInput();
                        if (ev.results[ev.results.length - 1].isFinal && aiChatInput.value.trim()) {
                            stopMic();
                            aiChatForm.requestSubmit();
                        }
                    };
                    recognizer.onerror = (ev) => {
                        if (ev.error === 'not-allowed') ErrorHandler.showError('اسمح للمتصفح يستخدم المايك عشان تقدر تتكلم');
                    };
                    recognizer.onend = () => { micBtn.classList.remove('rec'); recognizer = null; };
                    micBtn.classList.add('rec');
                    recognizer.start();
                } catch (e) {
                    micBtn.classList.remove('rec');
                    recognizer = null;
                }
            });
        }

        // ---------------- الإرسال
        function aiSend(text) {
            if (aiChatBusy) return;   // مانمسحش اللي المدرس بيكتبه وفيه طلب لسه شغال
            const typed = aiChatInput.value;
            aiChatInput.value = text;
            aiChatForm.requestSubmit();   // الإرسال بيقرا الرسالة فورًا
            if (typed.trim() && typed !== text) { aiChatInput.value = typed; autoGrowAiChatInput(); }
        }

        aiChatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (aiChatBusy) return;
            const message = aiChatInput.value.trim();
            if (!message) return;
            stopMic();

            aiChatBusy = true;
            aiChatSendBtn.disabled = true;
            try { (window.dataLayer = window.dataLayer || []).push({ event: 'ai_request', lesson_mode: mode || 'ready' }); } catch (err) { /* تجاهل */ }

            renderAiChatMessage('user', message);
            aiHistory.push({ role: 'user', text: message });
            aiStore.save();
            aiChatInput.value = '';
            autoGrowAiChatInput();
            // طلبات الشرح (تفسير/اشرح/حضّر...) بتاخد ثواني أكتر من الطلبات السريعة
            const deep = /تفسير|فس?ّ?ر|معن[ىي]|اشرح|شرح|إعراب|اعراب|قاعد|أحكام|احكام|حضّ?ر|خطة/.test(message);
            showAiTyping(deep ? 'بيجهّز الشرح' : 'بيكتب');
            const typingTimers = [
                setTimeout(() => { const t = aiChatMessages.querySelector('.ai-typing span'); if (t) t.textContent = deep ? 'بيراجع المعلومة' : 'ثانية واحدة'; }, 6000),
                setTimeout(() => { const t = aiChatMessages.querySelector('.ai-typing span'); if (t) t.textContent = 'لسه بيجهّز… قرّب يخلص'; }, 18000)
            ];
            // حد أقصى للانتظار: لو مفيش رد خلال 75 ثانية بنوقف ونقول للمدرس
            // مهلة "سكوت": لو مفيش ولا حرف وصل خلال 60 ثانية نوقف. طول ما الرد بيوصل مانقطعهوش
            const aborter = new AbortController();
            let hardStop = setTimeout(() => aborter.abort(), 60000);
            const bumpIdle = () => { clearTimeout(hardStop); hardStop = setTimeout(() => aborter.abort(), 45000); };

            let liveBubble = null;
            let pendingText = '';
            let frame = 0;
            const paint = () => {
                frame = 0;
                if (!liveBubble) {
                    liveBubble = renderAiChatMessage('assistant', '');
                    liveBubble.classList.add('is-streaming');
                }
                liveBubble.innerHTML = formatAiMarkdown(pendingText);
                aiScrollBottom();
            };
            try {
                const result = await api.chatWithAIAssistantStream(studentIdParam, message, {
                    lessonContext: aiLessonContext(),
                    sessionSince: aiSessionSince(),
                    signal: aborter.signal,
                    onText: (text) => { bumpIdle(); pendingText = text; if (!frame) frame = requestAnimationFrame(paint); },
                    onRetry: () => showAiTyping('ثانية واحدة')
                });
                if (frame) cancelAnimationFrame(frame);
                pendingText = result.reply;
                paint();
                liveBubble.classList.remove('is-streaming');
                aiHistory.push({ role: 'assistant', text: result.reply });
                aiStore.save();
                renderAiTools(result.reply);
                if (result.partialError) renderAiChatMessage('error', ErrorHandler.getErrorMessage(result.partialError) || 'انقطع الرد قبل اكتماله.', { keepTools: true });
                if (typeof result.remaining_today === 'number') {
                    aiChatQuota.textContent = result.remaining_today <= 10 ? `فاضل ${result.remaining_today} طلب النهارده` : '';
                }
            } catch (error) {
                if (frame) cancelAnimationFrame(frame);
                if (liveBubble) liveBubble.classList.remove('is-streaming');
                aiRemoveTransient();
                const timedOut = aborter.signal.aborted;
                const errText = timedOut ? 'المساعد اتأخر أكتر من اللازم. جرّب تاني، ولو اتكرر جرّب سؤال أقصر.' : (ErrorHandler.getErrorMessage(error) || 'حصلت مشكلة مع المساعد، جرّب تاني.');
                if (pendingText && pendingText.trim()) {
                    // جزء من الرد وصل قبل ما يقف: نحتفظ بيه بدل ما يضيع
                    if (!liveBubble) paint();
                    aiHistory.push({ role: 'assistant', text: pendingText });
                    aiStore.save();
                    renderAiTools(pendingText);
                    renderAiChatMessage('error', `${errText} (ده اللي وصل من الرد)`, { keepTools: true });
                } else {
                    renderAiChatMessage('error', errText, { keepTools: true });
                    // نرجّع الرسالة لمربع الكتابة عشان يبعتها تاني بضغطة
                    if (!aiChatInput.value) { aiChatInput.value = message; autoGrowAiChatInput(); }
                    aiHistory.pop();
                    aiStore.save();
                }
            } finally {
                typingTimers.forEach(clearTimeout);
                clearTimeout(hardStop);
                aiChatBusy = false;
                aiChatSendBtn.disabled = false;
                if (window.matchMedia('(min-width: 1024px)').matches) aiChatInput.focus();
            }
        });
        </script>
    <script src="js/pwa-install.js?v=21" defer></script>
